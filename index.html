/* =========================================================
   LESSON: Muster und Parkette
   ========================================================= */
{
const TILE={sq:{n:4,ok:1,meet:4},tri:{n:3,ok:1,meet:6},hex:{n:6,ok:1,meet:3},pent:{n:5,ok:0},oct:{n:8,ok:0},circ:{n:0,ok:0},rect:{n:-1,ok:1,meet:4},para:{n:-2,ok:1}};
function shapeIcon(k,col,W,H){W=W||110;H=H||90;if(k==='circ')return svgBox(W,H,`<circle cx="${W/2}" cy="${H/2}" r="${Math.min(W,H)/2-10}" fill="color-mix(in srgb,var(--pv-${col}) 30%,#fff)" stroke="var(--pv-${col})" stroke-width="3"/>`);
  if(k==='rect')return polySVG(QUADS.re.p,0,col,W,H);if(k==='para')return polySVG(QUADS.pa.p,0,col,W,H);return polySVG(regPoly(TILE[k].n),k==='sq'?Math.PI/4:0,col,W,H);}
const fillC=c=>`color-mix(in srgb,var(--pv-${c}) 45%,#fff)`;
function squaresTiling(W,H,s,cols){let g='';for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s)g+=`<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${fillC(cols[(x/s+y/s)%cols.length])}" stroke="#fff" stroke-width="2"/>`;return g;}
function triTiling(W,H,s){let g='';const h=s*Math.sqrt(3)/2;for(let r=0;r*h<H;r++)for(let i=-1;i*s/2<W+s;i++){const x=i*s/2,y=r*h,up=(i+r)%2===0;
  const pts=up?[[x,y+h],[x+s/2,y],[x+s,y+h]]:[[x,y],[x+s,y],[x+s/2,y+h]];g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${fillC(up?'g':'b')}" stroke="#fff" stroke-width="2"/>`;}return g;}
function hexTiling(W,H,r){let g='';const w=Math.sqrt(3)*r;for(let row=-1;row*1.5*r<H+r;row++)for(let c=-1;c*w<W+w;c++){const cx=c*w+(row%2?w/2:0),cy=row*1.5*r;
  g+=`<polygon points="${regPoly(6).map(([x,y])=>[cx+x*r,cy+y*r].join(',')).join(' ')}" fill="${fillC(['r','g','b'][(c+row*2+30)%3])}" stroke="#fff" stroke-width="2"/>`;}return g;}
function brickTiling(W,H,bw,bh,vert){let g='';if(!vert){for(let r=0;r*bh<H;r++)for(let x=(r%2?-bw/2:0);x<W;x+=bw)g+=`<rect x="${x}" y="${r*bh}" width="${bw}" height="${bh}" fill="${fillC(r%2?'r':'g')}" stroke="#fff" stroke-width="2"/>`;}
  else{for(let c=0;c*bh<W;c++)for(let y=(c%2?-bw/2:0);y<H;y+=bw)g+=`<rect x="${c*bh}" y="${y}" width="${bh}" height="${bw}" fill="${fillC(c%2?'b':'g')}" stroke="#fff" stroke-width="2"/>`;}return g;}
function circleRows(W,H,r){let g='';for(let y=r;y<H+r;y+=2*r)for(let x=r;x<W+r;x+=2*r)g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fillC('b')}" stroke="#fff" stroke-width="2"/>`;return g;}
let tcN=0;const tileBox=(inner,W,H)=>{const id='tc'+(++tcN);return svgBox(W||260,H||150,`<clipPath id="${id}"><rect width="${W||260}" height="${H||150}" rx="10"/></clipPath><g clip-path="url(#${id})">${inner}</g><rect width="${W||260}" height="${H||150}" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/>`);};
const SHN={sq:t3('Quadrat','Square','Cuadrado'),tri:t3('Dreieck','Triangle','Triángulo'),hex:t3('Sechseck','Hexagon','Hexágono'),pent:t3('Fünfeck','Pentagon','Pentágono'),oct:t3('Achteck','Octagon','Octógono'),circ:t3('Kreis','Circle','Círculo'),rect:t3('Rechteck','Rectangle','Rectángulo'),para:t3('Parallelogramm','Parallelogram','Paralelogramo')};
const CN={r:t3('rot','red','rojo'),b:t3('blau','blue','azul'),g:t3('grün','green','verde'),y:t3('gelb','yellow','amarillo')};
const swatch=c=>`<span style="display:inline-block;width:30px;height:30px;border-radius:6px;vertical-align:middle;background:${c==='y'?'var(--star)':'var(--pv-'+c+')'}"></span>`;
function holeBrick(){const vert=Math.random()<.5,W=260,H=150,bw=52,bh=26;let g=brickTiling(W,H,bw,bh,vert);let hx,hy,hw,hh;
  if(!vert){const r=2;hx=(r%2?-bw/2:0)+bw*2;hy=r*bh;hw=bw;hh=bh;}else{const c=4;hx=c*bh;hy=(c%2?-bw/2:0)+bw;hw=bh;hh=bw;}
  g+=`<rect x="${hx+1}" y="${hy+1}" width="${hw-2}" height="${hh-2}" fill="#fff" stroke="var(--pen)" stroke-width="2.5" stroke-dasharray="5 4"/>`;return {svg:tileBox(g,W,H),ans:vert?'vr':'hr'};}
const HOLEOPT={hr:()=>svgBox(80,60,`<rect x="12" y="20" width="56" height="26" rx="2" fill="${fillC('g')}" stroke="var(--pv-g)" stroke-width="2"/>`),vr:()=>svgBox(80,60,`<rect x="27" y="4" width="26" height="52" rx="2" fill="${fillC('b')}" stroke="var(--pv-b)" stroke-width="2"/>`),
  sq:()=>svgBox(80,60,`<rect x="22" y="12" width="36" height="36" rx="2" fill="${fillC('r')}" stroke="var(--pv-r)" stroke-width="2"/>`),tr:()=>svgBox(80,60,`<polygon points="14,52 40,8 66,52" fill="${fillC('g')}" stroke="var(--pv-g)" stroke-width="2"/>`)};
defLesson('tiles',{
  h1:t3('Muster und <span>Parkette</span>','Patterns and <span>tilings</span>','Mosaicos y <span>teselados</span>'),
  intro:t3('Hallo! Ich möchte den Boden in meinem Baumhaus mit bunten Fliesen auslegen. Ohne Lücken! Hilfst du mir, die richtigen Formen zu finden?',
    'Hi! I want to tile the floor of my tree house with colourful tiles. No gaps allowed! Will you help me find the right shapes?',
    '¡Hola! Quiero cubrir el suelo de mi casa del árbol con baldosas de colores. ¡Sin huecos! ¿Me ayudas a encontrar las formas adecuadas?'),
  steps:[
    {t:t3('Lückenlos legen','No gaps','Sin huecos'),v:()=>tileBox(squaresTiling(260,150,30,['g','b'])),
     say:t3('Die Fliesen müssen genau aneinander passen. Es darf keine Lücke bleiben, und keine Fliese darf über einer anderen liegen. So ein Muster nennt man Parkett.',
       'The tiles have to fit together exactly. There must be no gaps, and no tile may lie on top of another. A pattern like this is called a tiling.',
       'Las baldosas tienen que encajar exactamente. No puede quedar ningún hueco y ninguna puede ir encima de otra. Un dibujo así se llama teselado.')},
    {t:t3('Welche Formen klappen?','Which shapes work?','¿Qué formas sirven?'),v:()=>`<figure class="it">${tileBox(triTiling(130,100,40),130,100)}<figcaption>✔</figcaption></figure><figure class="it">${tileBox(hexTiling(130,100,20),130,100)}<figcaption>✔</figcaption></figure><figure class="it">${tileBox(circleRows(130,100,18),130,100)}<figcaption>✘</figcaption></figure>`,
     say:t3('Mit Quadraten, Rechtecken, gleichseitigen Dreiecken und Sechsecken klappt es. Mit Kreisen nicht: Zwischen ihnen bleiben immer Lücken.',
       'It works with squares, rectangles, equilateral triangles and hexagons. It doesn’t work with circles: there are always gaps between them.',
       'Funciona con cuadrados, rectángulos, triángulos equiláteros y hexágonos. Con círculos no: siempre quedan huecos entre ellos.')},
    {t:t3('Das Grundmuster','The basic pattern','El motivo básico'),v:()=>tileBox(brickTiling(260,150,52,26,false)),
     say:t3('Bei diesem Muster liegen Rechtecke versetzt, wie bei einer Mauer. Das Grundmuster wird immer wieder nach rechts, links, oben und unten weitergelegt.',
       'In this pattern the rectangles are staggered, like in a wall. The basic pattern is repeated again and again to the right, left, up and down.',
       'En este dibujo los rectángulos están desplazados, como en un muro. El motivo básico se repite una y otra vez hacia la derecha, la izquierda, arriba y abajo.')},
    {t:t3('Leos Trick','Leo’s trick','El truco de Leo'),eq:t3('An jeder Ecke muss es genau rundherum passen','At every corner it must fit exactly all the way round','En cada vértice tiene que encajar justo todo alrededor'),
     v:()=>svgBox(200,150,`<rect x="40" y="15" width="60" height="60" fill="${fillC('g')}" stroke="#fff" stroke-width="2"/><rect x="100" y="15" width="60" height="60" fill="${fillC('b')}" stroke="#fff" stroke-width="2"/><rect x="40" y="75" width="60" height="60" fill="${fillC('b')}" stroke="#fff" stroke-width="2"/><rect x="100" y="75" width="60" height="60" fill="${fillC('g')}" stroke="#fff" stroke-width="2"/><circle cx="100" cy="75" r="7" fill="var(--pen)"/>`),
     say:t3('Schau auf einen Punkt, an dem Fliesen zusammenstoßen. Die Ecken müssen genau rundherum passen. Bei Quadraten treffen sich 4 rechte Winkel. Bei Dreiecken sind es 6 Ecken, bei Sechsecken 3.',
       'Look at a point where tiles meet. The corners have to fit exactly all the way round. With squares, 4 right angles meet. With triangles it is 6 corners, with hexagons 3.',
       'Mira un punto donde se juntan baldosas. Las esquinas tienen que encajar justo todo alrededor. Con cuadrados se juntan 4 ángulos rectos. Con triángulos son 6 esquinas y con hexágonos 3.')}
  ],
  remember:()=>({
    rule:`<span>${tx(t3('Parkett','Tiling','Teselado'))}</span> = ${tx(t3('lückenlos','no gaps','sin huecos'))} + ${tx(t3('ohne Überlappung','no overlaps','sin superponer'))}<p class="rulecap">${tx(t3('Ein Grundmuster wird nach allen Seiten wiederholt.','A basic pattern is repeated in every direction.','Un motivo básico se repite en todas las direcciones.'))}</p>`,
    p:t3('Drei Parkette:','Three tilings:','Tres teselados:'),
    ways:`<div class="way">${tileBox(triTiling(260,130,44),260,130)}</div><div class="way">${tileBox(hexTiling(260,130,22),260,130)}</div>`
  }),
  quiz:{
    no(){const k=pick(['circ','pent','oct']);return mkQ(tx(t3('Mit welcher Form allein kann man nicht lückenlos auslegen?','Which shape on its own can’t cover a floor without gaps?','¿Con qué forma sola no se puede cubrir sin huecos?')),tx(SHN[k]),['sq','tri','hex','rect'].map(x=>tx(SHN[x])),tx(t3('Bei ihr bleiben immer Lücken.','It always leaves gaps.','Con ella siempre quedan huecos.')));},
    meet(){const k=pick(['sq','tri','hex']);return mkQ(tx(t3(`Wie viele ${tx(SHN[k])}e treffen sich in einem Parkett an einer Ecke?`,`In a tiling, how many ${tx(SHN[k]).toLowerCase()}s meet at one corner?`,`En un teselado, ¿cuántos ${tx(SHN[k]).toLowerCase()}s se juntan en un vértice?`)).replace('Dreiecke','Dreiecke').replace('Quadrate','Quadrate'),String(TILE[k].meet),['3','4','5','6','8'],
      tx(t3('Zähle die Ecken rund um einen Punkt.','Count the corners around one point.','Cuenta las esquinas alrededor de un punto.')));},
    def(){return mkQ(tx(t3('Was gehört zu einem Parkett?','What does a tiling need?','¿Qué necesita un teselado?')),tx(t3('keine Lücken und keine Überlappung','no gaps and no overlaps','sin huecos ni superposiciones')),[t3('nur runde Formen','only round shapes','solo formas redondas'),t3('mindestens eine Lücke','at least one gap','al menos un hueco'),t3('alle Fliesen übereinander','all tiles on top of each other','todas las baldosas unas encima de otras')].map(tx),'');},
    count(){const a=rnd(3,7),b=rnd(2,6);return mkQ(tx(t3(`Ein Boden ist ${a} m lang und ${b} m breit. Wie viele Fliesen von 1 m mal 1 m braucht man?`,`A floor is ${a} m long and ${b} m wide. How many 1 m by 1 m tiles do you need?`,`Un suelo mide ${a} m de largo y ${b} m de ancho. ¿Cuántas baldosas de 1 m por 1 m hacen falta?`)),a*b,[a+b,2*(a+b),a*b+a],`${a} · ${b} = ${a*b}`);}
  },
  gen:{
    pk_form:{l:t3('Klappt diese Form?','Does this shape work?','¿Sirve esta forma?'),f(){const k=pick(Object.keys(TILE)),ok=TILE[k].ok;
      return mcTask(tx(t3('Kann man mit dieser Form allein lückenlos auslegen?','Can this shape on its own cover a floor without gaps?','¿Se puede cubrir un suelo sin huecos solo con esta forma?')),shapeIcon(k,pick(['b','g','r']),160,120),['y','n'],ok?'y':'n',x=>x==='y'?YES():NO(),
        `<b>${ok?YES():NO()}</b> (${tx(SHN[k])})`,tx(t3('Stell dir vor, du legst viele davon nebeneinander. Bleibt eine Lücke?','Imagine putting lots of them next to each other. Is there a gap?','Imagina que pones muchas juntas. ¿Queda algún hueco?')));}},
    pk_luecke:{l:t3('Lücke füllen','Fill the gap','Rellenar el hueco'),f(){const h=holeBrick();
      return mcTask(tx(t3('Welche Fliese passt in die Lücke?','Which tile fits the gap?','¿Qué baldosa encaja en el hueco?')),h.svg,['hr','vr','sq','tr'],h.ans,x=>HOLEOPT[x](),tx(t3('Die Fliese muss genauso aussehen wie ihre Nachbarn in derselben Reihe.','The tile must look like its neighbours in the same row.','La baldosa debe ser como sus vecinas de la misma fila.')),
        tx(t3('Achte darauf, ob die Fliesen liegen oder stehen.','Check whether the tiles are lying flat or standing upright.','Fíjate si las baldosas están tumbadas o de pie.')));}},
    pk_weiter:{l:t3('Muster fortsetzen','Continue the pattern','Continuar el patrón'),f(){const cols=shuffle(['r','b','g','y']),unit=pick([[0,1],[0,1,1],[0,0,1],[0,1,2],[0,1,2,1]]).map(i=>cols[i]),n=rnd(6,8),seq=[...Array(n)].map((_,i)=>unit[i%unit.length]),ans=unit[n%unit.length];
      return mcTask(tx(t3('Welche Farbe kommt als Nächstes?','Which colour comes next?','¿Qué color viene después?')),`<p>${seq.map(swatch).join(' ')} <b style="font-size:1.4rem">?</b></p>`,['r','b','g','y'],ans,x=>swatch(x),`${swatch(ans)} <b>${tx(CN[ans])}</b>`,
        tx(t3(`Das Grundmuster hat ${unit.length} Fliesen. Such es am Anfang.`,`The basic pattern has ${unit.length} tiles. Find it at the start.`,`El motivo básico tiene ${unit.length} baldosas. Búscalo al principio.`)));}},
    pk_zaehle:{l:t3('Fliesen zählen','Counting tiles','Contar baldosas'),f(){const half=Math.random()<.5,a=rnd(2,6),b=rnd(2,5),n=half?(a*2)*(b*2):a*b;
      return numTask(tx(t3(`Leos Baumhaus-Boden ist ${a} m lang und ${b} m breit. Er nimmt Fliesen von ${half?'50 cm mal 50 cm':'1 m mal 1 m'}. Wie viele braucht er?`,`Leo’s tree house floor is ${a} m long and ${b} m wide. He uses tiles of ${half?'50 cm by 50 cm':'1 m by 1 m'}. How many does he need?`,`El suelo de la casa del árbol mide ${a} m de largo y ${b} m de ancho. Usa baldosas de ${half?'50 cm por 50 cm':'1 m por 1 m'}. ¿Cuántas necesita?`)),'',n,
        half?`${a*2} · ${b*2} = <b>${n}</b>`:`${a} · ${b} = <b>${n}</b>`,half?tx(t3('In 1 m passen 2 Fliesen von 50 cm.','Two 50 cm tiles fit into 1 m.','En 1 m caben 2 baldosas de 50 cm.')):tx(t3('Wie viele Fliesen passen in eine Reihe? Wie viele Reihen gibt es?','How many tiles fit in a row? How many rows are there?','¿Cuántas caben en una fila? ¿Cuántas filas hay?')));}},
    pk_ecke:{l:t3('Ecken im Parkett','Corners in a tiling','Vértices del teselado'),f(){const k=pick(['sq','tri','hex']);const svg=k==='sq'?tileBox(squaresTiling(260,150,50,['g','b'])):k==='tri'?tileBox(triTiling(260,150,60)):tileBox(hexTiling(260,150,32));
      return numTask(tx(t3('Wie viele Fliesen treffen sich an einem Eckpunkt in der Mitte?','How many tiles meet at one corner point in the middle?','¿Cuántas baldosas se juntan en un vértice del centro?')),svg,TILE[k].meet,`<b>${TILE[k].meet}</b>`,tx(t3('Such einen Punkt, an dem sich Fliesen berühren, und zähle rundherum.','Find a point where tiles touch and count all the way round.','Busca un punto donde se tocan baldosas y cuenta alrededor.')));}}
  },
  riddles:{
    rand(){const a=rnd(5,9),b=rnd(4,7);return {title:tx(t3('Der Rand','The border','El borde')),text:tx(t3(`Ein Boden aus ${a} mal ${b} Fliesen bekommt einen roten Rand: Alle Fliesen am Rand sind rot. Wie viele rote Fliesen sind es?`,`A floor of ${a} by ${b} tiles gets a red border: all the tiles along the edge are red. How many red tiles are there?`,`Un suelo de ${a} por ${b} baldosas tiene un borde rojo: todas las baldosas del borde son rojas. ¿Cuántas rojas hay?`)),
      f:[[tx(t3('Rote Fliesen','Red tiles','Baldosas rojas')),2*a+2*b-4]],hint:tx(t3('Zähle die vier Seiten, aber jede Ecke nur einmal!','Count the four sides, but each corner only once!','Cuenta los cuatro lados, ¡pero cada esquina solo una vez!')),ans:String(2*a+2*b-4),expl:`${a} + ${a} + ${b-2} + ${b-2} = ${2*a+2*b-4}`};},
    innen(){const a=rnd(5,9),b=rnd(4,7);return {title:tx(t3('Die Mitte','The middle','El centro')),text:tx(t3(`Ein Boden ist ${a} Fliesen lang und ${b} Fliesen breit. Der Rand ist rot, alles innen ist gelb. Wie viele gelbe Fliesen gibt es?`,`A floor is ${a} tiles long and ${b} tiles wide. The border is red and everything inside is yellow. How many yellow tiles are there?`,`Un suelo mide ${a} baldosas de largo y ${b} de ancho. El borde es rojo y todo lo de dentro amarillo. ¿Cuántas amarillas hay?`)),
      f:[[tx(t3('Gelbe Fliesen','Yellow tiles','Baldosas amarillas')),(a-2)*(b-2)]],hint:tx(t3('Innen ist es auf jeder Seite eine Fliese kürzer.','Inside it is one tile shorter on each side.','Dentro es una baldosa más corto por cada lado.')),ans:String((a-2)*(b-2)),expl:`${a-2} · ${b-2} = ${(a-2)*(b-2)}`};},
    preis(){const n=rnd(12,30),p=pick([2,3,4,5]);return {title:tx(t3('Fliesen kaufen','Buying tiles','Comprar baldosas')),text:tx(t3(`Eine Fliese kostet ${p} €. Leo braucht ${n} Fliesen und kauft 2 als Reserve dazu. Wie viel bezahlt er?`,`A tile costs €${p}. Leo needs ${n} tiles and buys 2 extra just in case. How much does he pay?`,`Una baldosa cuesta ${p} €. Leo necesita ${n} y compra 2 de reserva. ¿Cuánto paga?`)),
      f:[['€',(n+2)*p]],hint:`${n} + 2 = ${n+2}`,ans:`${(n+2)*p} €`,expl:`${n+2} · ${p} = ${(n+2)*p}`};}
  },
  pro:[
    ()=>({title:tx(t3('Das L-Zimmer','The L-shaped room','La habitación en L')),text:tx(t3('Ein Zimmer hat die Form eines L. Es ist ein Rechteck von 6 m mal 4 m, aus dem in einer Ecke ein Stück von 2 m mal 2 m fehlt. Wie viele Fliesen von 1 m mal 1 m braucht man?','A room is shaped like an L. It is a 6 m by 4 m rectangle with a 2 m by 2 m piece missing in one corner. How many 1 m by 1 m tiles do you need?','Una habitación tiene forma de L. Es un rectángulo de 6 m por 4 m al que le falta un trozo de 2 m por 2 m en una esquina. ¿Cuántas baldosas de 1 m por 1 m hacen falta?')),
      f:[[tx(t3('Fliesen','Tiles','Baldosas')),20]],hint:tx(t3('Rechne erst das ganze Rechteck, dann zieh das fehlende Stück ab.','First work out the whole rectangle, then take away the missing piece.','Calcula primero el rectángulo entero y luego resta el trozo que falta.')),ans:'20',expl:'24 − 4 = 20'}),
    ()=>({title:tx(t3('Dreiecke aus Quadraten','Triangles from squares','Triángulos con cuadrados')),text:tx(t3('Leo schneidet jede quadratische Fliese einmal schräg durch, von Ecke zu Ecke. Aus wie vielen Dreiecken besteht dann ein Boden von 5 mal 3 Fliesen?','Leo cuts every square tile once diagonally, from corner to corner. How many triangles make up a floor of 5 by 3 tiles then?','Leo corta cada baldosa cuadrada en diagonal, de esquina a esquina. ¿Cuántos triángulos forman entonces un suelo de 5 por 3 baldosas?')),
      f:[[tx(t3('Dreiecke','Triangles','Triángulos')),30]],hint:tx(t3('Aus jedem Quadrat werden 2 Dreiecke.','Every square becomes 2 triangles.','Cada cuadrado se convierte en 2 triángulos.')),ans:'30',expl:'5 · 3 · 2 = 30'})
  ]
});
}

defLesson('lengths',{
  h1:t3('Von <span>Millimeter</span> bis Kilometer','From <span>millimetres</span> to kilometres','Del <span>milímetro</span> al kilómetro'),
  intro:t3('Hallo! Wie lang ist eine Ameise? Und wie weit ist es bis zur Oma? Heute messen wir ganz kleine und ganz große Längen.',
    'Hi! How long is an ant? And how far is it to Grandma’s? Today we measure very small and very big lengths.',
    '¡Hola! ¿Cuánto mide una hormiga? ¿Y cuánto hay hasta casa de la abuela? Hoy medimos longitudes muy pequeñas y muy grandes.'),
  steps:[
    {t:t3('Vom Millimeter zum Kilometer','From millimetre to kilometre','Del milímetro al kilómetro'),
     v:()=>`<div class="ladder">${[['mm','g'],['cm','b'],['m','r'],['km','g']].map(([u,c],i)=>(i?`<span class="step">×${[10,100,1000][i-1]}</span>`:'')+`<span class="rung c-${c}"><b>1 ${u}</b></span>`).join('')}</div>`,
     say:t3('Ein Millimeter ist ungefähr so dick wie eine Münze. Ein Zentimeter ist so breit wie dein kleiner Finger. Ein Meter ist ein großer Schritt. Und einen Kilometer läufst du in etwa einer Viertelstunde.',
       'A millimetre is about as thick as a coin. A centimetre is about as wide as your little finger. A metre is a big step. And you walk a kilometre in about a quarter of an hour.',
       'Un milímetro es más o menos el grosor de una moneda. Un centímetro es el ancho de tu dedo meñique. Un metro es un paso grande. Y un kilómetro lo andas en un cuarto de hora más o menos.')},
    {t:t3('Meter und Kilometer','Metres and kilometres','Metros y kilómetros'),eq:()=>`1 km = ${fmt(1000)} m · ½ km = 500 m · ¼ km = 250 m · ¾ km = 750 m`,
     v:()=>svgBox(320,110,[0,1,2,3].map(i=>`<rect x="${10+i*75}" y="14" width="75" height="44" fill="color-mix(in srgb,var(--pv-${['b','g','b','g'][i]}) 40%,#fff)" stroke="var(--ink)" stroke-width="1.5"/><text x="${47.5+i*75}" y="42" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)" font-family="Nunito,sans-serif">250 m</text>`).join('')+`<text x="160" y="92" text-anchor="middle" font-size="19" font-weight="800" fill="var(--pen)" font-family="Nunito,sans-serif">1 km = ${fmt(1000)} m</text>`),
     say:t3('1 Kilometer sind 1 000 Meter. Ein halber Kilometer sind also 500 Meter, ein Viertel 250 Meter und drei Viertel 750 Meter.',
       '1 kilometre is 1,000 metres. So half a kilometre is 500 metres, a quarter is 250 metres and three quarters are 750 metres.',
       '1 kilómetro son 1 000 metros. Medio kilómetro son 500 metros, un cuarto son 250 metros y tres cuartos son 750 metros.')},
    {t:t3('Die Kommaschreibweise','Writing with a decimal point','Escribir con coma'),eq:()=>`3 km 45 m = ${fmtDec(3.045,3)} km`,
     v:()=>`<div class="tw"><table class="pvt"><tr><th class="c-r">km</th><th style="width:1em"></th><th class="c-b">H</th><th class="c-b">Z</th><th class="c-b">E</th></tr><tr><td>3</td><td>${decSep()}</td><td>0</td><td>4</td><td>5</td></tr></table></div>`.replace(/>H</,`>${AB('H')} m<`).replace(/>Z</,`>${AB('Z')} m<`).replace(/>E</,`>${AB('E')} m<`),
     say:t3('3 km 450 m kann man auch mit Komma schreiben: 3,450 km. Vor dem Komma stehen die Kilometer. Danach kommen immer genau 3 Stellen für die Meter. 3 km 45 m sind also 3,045 km. Die Null ist wichtig!',

{
const PK=['E','Z','H','T','ZT','HT','M'];
function carriesOf(a,b){const ds=String(a).split('').reverse().map(Number),c=[0];let k=0;ds.forEach((d,i)=>{const p=d*b+k;k=Math.floor(p/10);c[i+1]=k;});return c;}/* c[i] = carry into column i */
function mulGrid(a,b,mode){const as=String(a),p=a*b,ps=String(p),L=as.length+1,cr=carriesOf(a,b);
  const col=i=>`c-${PCOL[PK[i]]}`;let h=`<div class="tw"><table class="pvt mgrid"><tr>`;
  for(let i=L-1;i>=0;i--)h+=`<th class="${col(i)}">${AB(PK[i])}</th>`;h+=`<th style="border:0;width:1.4em"></th><th style="border:0;width:1.6em"></th></tr><tr>`;
  for(let i=L-1;i>=0;i--)h+=`<td>${as[as.length-1-i]||''}</td>`;h+=`<td style="border:0">·</td><td style="border:0">${b}</td></tr>`;
  h+=`<tr class="mrule"><td colspan="${L}"></td><td style="border:0"></td><td style="border:0"></td></tr><tr class="mcarry">`;
  for(let i=L-1;i>=0;i--){if(mode==='show')h+=`<td>${i>0&&cr[i]?cr[i]:''}</td>`;else h+=`<td>${i>0?`<input class="carry" inputmode="numeric" maxlength="1" aria-label="${tx(t3('gemerkt','carried','me llevo'))}">`:''}</td>`;}
  h+=`<td style="border:0"></td><td style="border:0"></td></tr><tr>`;
  for(let i=L-1;i>=0;i--){const d=ps[ps.length-1-i]||'';if(mode==='show')h+=`<td>${d}</td>`;else h+=`<td><input class="cell" data-rtl="1" inputmode="numeric" maxlength="1" aria-label="${T('sg')[PK[i]]}"></td>`;}
  return h+`<td style="border:0"></td><td style="border:0"></td></tr></table></div>`;}
function gridTask(a,b,q){const p=a*b,ps=String(p),L=String(a).length+1,want=[...Array(L)].map((_,j)=>{const i=L-1-j;return ps[ps.length-1-i]||'';});
  const ok=v=>want.map((w,j)=>w===''?(v[j].trim()===''||v[j].trim()==='0'):v[j].trim()===w);
  return {q,body:mulGrid(a,b,'input')+`<p class="note">${tx(t3('Tipp: Die kleinen Kästchen oben sind für das, was du dir merkst. Sie werden nicht bewertet.','Tip: the small boxes on top are for what you carry. They are not marked.','Consejo: las casillas pequeñas de arriba son para lo que te llevas. No se corrigen.'))}</p>`,
    check:v=>ok(v).every(Boolean),perField:ok,sol:`${fmt(a)} · ${b} = <b>${fmt(p)}</b>`,a:want,
    hint:tx(t3(`Fang rechts bei den Einern an: ${b} · ${String(a).slice(-1)} = ${b*+String(a).slice(-1)}. Schreib die Einer hin und merk dir die Zehner.`,`Start on the right with the ones: ${b} · ${String(a).slice(-1)} = ${b*+String(a).slice(-1)}. Write the ones and carry the tens.`,`Empieza por la derecha, por las unidades: ${b} · ${String(a).slice(-1)} = ${b*+String(a).slice(-1)}. Escribe las unidades y llévate las decenas.`))};}
function noCarry(){for(;;){const b=rnd(2,4),len=rnd(3,5);let s=''+rnd(1,Math.floor(9/b));for(let i=1;i<len;i++)s+=rnd(0,Math.floor(9/b));const a=+s;if(carriesOf(a,b).every(x=>!x))return [a,b];}}
function withCarry(){for(;;){const b=rnd(3,9),a=makeNum(rnd(3,5),.15);if(carriesOf(a,b).some(x=>x)&&a*b<1e6)return [a,b];}}
const lead=a=>{const s=String(a),k=10**(s.length-1);return Math.round(a/k)*k;};
defLesson('mult',{
  h1:t3('Schriftlich <span>malnehmen</span>','Written <span>multiplication</span>','Multiplicar <span>por escrito</span>'),
  intro:t3('Hallo! Große Zahlen malnehmen geht im Kopf schwer. Aufgeschrieben ist es ganz leicht. Ich zeige dir Schritt für Schritt, wie es geht.',
    'Hi! Multiplying big numbers in your head is hard. Written down it’s easy. I’ll show you step by step how it works.',
    '¡Hola! Multiplicar números grandes de cabeza es difícil. Por escrito es muy fácil. Te lo enseño paso a paso.'),
  steps:[
    {t:t3('In Stücken rechnen','Working in pieces','Calcular por partes'),eq:()=>`${fmt(312)} · 3 = 900 + 30 + 6 = ${fmt(936)}`,
     v:()=>`<p class="handnum" style="text-align:center">300 · 3 = 900<br>10 · 3 = 30<br>2 · 3 = 6</p>`,
     say:t3('Leo rechnet 312 mal 3. Er zerlegt 312 in 300, 10 und 2. 300 mal 3 ist 900, 10 mal 3 ist 30 und 2 mal 3 ist 6. Zusammen sind das 936.',
       'Leo works out 312 times 3. He splits 312 into 300, 10 and 2. 300 times 3 is 900, 10 times 3 is 30 and 2 times 3 is 6. Together that is 936.',
       'Leo calcula 312 por 3. Descompone 312 en 300, 10 y 2. 300 por 3 son 900, 10 por 3 son 30 y 2 por 3 son 6. En total, 936.')},
    {t:t3('Kurz und schriftlich','Short and written','Corto y por escrito'),v:()=>mulGrid(312,3,'show'),
     say:t3('Schriftlich geht es kürzer. Leo fängt rechts bei den Einern an: 3 mal 2 Einer sind 6 Einer, er schreibt 6. 3 mal 1 Zehner sind 3 Zehner, er schreibt 3. 3 mal 3 Hunderter sind 9 Hunderter, er schreibt 9.',
       'Written down it’s shorter. Leo starts on the right with the ones: 3 times 2 ones are 6 ones, he writes 6. 3 times 1 ten is 3 tens, he writes 3. 3 times 3 hundreds are 9 hundreds, he writes 9.',
       'Por escrito es más corto. Leo empieza por la derecha, por las unidades: 3 por 2 unidades son 6 unidades, escribe 6. 3 por 1 decena son 3 decenas, escribe 3. 3 por 3 centenas son 9 centenas, escribe 9.')},
    {t:t3('Mit Übertrag','With carrying','Con llevadas'),v:()=>mulGrid(254,3,'show'),
     say:t3('Bei 254 mal 3 rechnet Leo: 3 mal 4 Einer sind 12 Einer. Er schreibt 2 und merkt sich 1 Zehner. 3 mal 5 Zehner sind 15 Zehner, plus 1 gemerkter sind 16 Zehner. Er schreibt 6 und merkt sich 1 Hunderter. 3 mal 2 Hunderter sind 6, plus 1 sind 7. Ergebnis: 762.',
       'For 254 times 3 Leo works out: 3 times 4 ones are 12 ones. He writes 2 and carries 1 ten. 3 times 5 tens are 15 tens, plus the 1 he carried makes 16 tens. He writes 6 and carries 1 hundred. 3 times 2 hundreds are 6, plus 1 is 7. Answer: 762.',
       'Para 254 por 3 Leo calcula: 3 por 4 unidades son 12 unidades. Escribe 2 y se lleva 1 decena. 3 por 5 decenas son 15, más 1 que se llevaba son 16 decenas. Escribe 6 y se lleva 1 centena. 3 por 2 centenas son 6, más 1 son 7. Resultado: 762.')},
    {t:t3('Erst überschlagen','Estimate first','Primero estima'),eq:()=>`${fmt(254)} · 3 ≈ 250 · 3 = 750`,v:()=>card('762','g')+arrowSym('≈')+card('750','b'),

    carry(){const d=rnd(3,9),b=rnd(3,9),p=d*b;if(p<10)return LDEF.mult.quiz.carry();const w=t3(`schreibe ${p%10}, merke ${Math.floor(p/10)}`,`write ${p%10}, carry ${Math.floor(p/10)}`,`escribo ${p%10}, me llevo ${Math.floor(p/10)}`);

  gen:{

    mu_ueber:{l:t3('Überschlag','Estimate','Estimación'),f(){const [a,b]=withCarry(),e=lead(a)*b,opts=[...new Set([e,e*10,e/10,lead(a)*(b+2)])].filter(x=>Number.isInteger(x));

    mu_pruef:{l:t3('Kann das stimmen?','Can that be right?','¿Puede ser?'),f(){const [a,b]=withCarry(),p=a*b,right=Math.random()<.5;let shown=p;if(!right){shown=pick([p*10,Math.round(p/10),p+lead(a)*pick([2,3]),p-lead(a)*2]);if(shown<=0)shown=p*10;}

        `${fmt(lead(a))} · ${b} = ${fmt(lead(a)*b)}. ${tx(t3('Richtig ist','The right answer is','Lo correcto es'))} ${fmt(p)}.`,tx(t3('Runde die große Zahl und rechne im Kopf. Liegt das Ergebnis nah dran?','Round the big number and work it out in your head. Is the answer close?','Redondea el número grande y calcula de cabeza. ¿Está cerca el resultado?')));}},
    mu_euro:{l:t3('Mit Euro','With euros','Con euros'),f(){const c=rnd(25,1999),n=rnd(2,9),p=c*n;
      return decTask(tx(t3(`Was kosten <b>${n}</b> Stück zu je <b>${euro(c)}</b>?`,`How much do <b>${n}</b> items at <b>${euro(c)}</b> each cost?`,`¿Cuánto cuestan <b>${n}</b> unidades a <b>${euro(c)}</b> cada una?`)),'',p/100,`${c} ct · ${n} = ${p} ct = <b>${euro(p)}</b>`,
        tx(t3('Rechne in Cent, dann setze das Komma: Die letzten 2 Ziffern sind die Cent.','Work in cents, then put the point back: the last 2 digits are the cents.','Calcula en céntimos y luego pon la coma: las 2 últimas cifras son los céntimos.')),'€');}},
    mu_luecke:{l:t3('Fehlende Ziffer','Missing digit','Cifra que falta'),f(){const [a,b]=withCarry(),s=String(a),i=rnd(0,s.length-1),d=+s[i];if(i===0&&d===0)return LDEF.mult.gen.mu_luecke();
      const shown=s.slice(0,i)+'□'+s.slice(i+1),ok=[];for(let x=i===0?1:0;x<=9;x++)if(+(s.slice(0,i)+x+s.slice(i+1))*b===a*b)ok.push(x);
      return {q:tx(t3('Welche Ziffer fehlt im Kästchen?','Which digit is missing in the box?','¿Qué cifra falta en la casilla?')),body:`<p class="bignum">${shown} · ${b} = ${fmt(a*b)}</p>`+numIn(true),check:v=>ok.includes(parseNum(v[0]))&&v[0].trim().length===1,sol:`${fmt(a)} · ${b} = ${fmt(a*b)} → <b>${d}</b>`,
        hint:tx(t3(`Teile ${fmt(a*b)} durch ${b} oder probiere Ziffern aus.`,`Divide ${fmt(a*b)} by ${b}, or try out digits.`,`Divide ${fmt(a*b)} entre ${b} o prueba cifras.`)),a:[String(d)]};}}
  },
  riddles:{

    zurueck(){const b=pick([3,4,6,7,8,9]),a=rnd(101,999);return {title:tx(t3('Rückwärts gedacht','Thinking backwards','Pensar al revés')),text:tx(t3(`Leo nimmt eine Zahl mal ${b} und bekommt ${fmt(a*b)}. Welche Zahl war es?`,`Leo multiplies a number by ${b} and gets ${fmt(a*b)}. Which number was it?`,`Leo multiplica un número por ${b} y obtiene ${fmt(a*b)}. ¿Qué número era?`)),
      f:[[T('label_iam'),a]],hint:tx(t3(`Überschlag: ${fmt(a*b)} : ${b} ist ungefähr ${fmt(Math.round(a/100)*100)}. Prüfe mit Malnehmen.`,`Estimate: ${fmt(a*b)} : ${b} is about ${fmt(Math.round(a/100)*100)}. Check by multiplying.`,`Estimación: ${fmt(a*b)} : ${b} es más o menos ${fmt(Math.round(a/100)*100)}. Compruébalo multiplicando.`)),ans:fmt(a),expl:`${fmt(a)} · ${b} = ${fmt(a*b)}`};},
    kiste(){const p=rnd(12,48),k=rnd(6,9),r=rnd(3,9);return {title:tx(t3('Äpfel in Kisten','Apples in crates','Manzanas en cajas')),text:tx(t3(`Ein Bauer füllt ${k} Kisten mit je ${p} Äpfeln. Dann bekommt jede Kiste noch ${r} Äpfel dazu. Wie viele Äpfel sind es jetzt?`,`A farmer fills ${k} crates with ${p} apples each. Then every crate gets ${r} more apples. How many apples are there now?`,`Un granjero llena ${k} cajas con ${p} manzanas cada una. Luego cada caja recibe ${r} manzanas más. ¿Cuántas hay ahora?`)),
      f:[[tx(t3('Äpfel','Apples','Manzanas')),k*(p+r)]],hint:tx(t3(`In jeder Kiste sind jetzt ${p} + ${r} Äpfel.`,`Every crate now holds ${p} + ${r} apples.`,`En cada caja hay ahora ${p} + ${r} manzanas.`)),ans:fmt(k*(p+r)),expl:`${k} · ${p+r} = ${fmt(k*(p+r))}`};}
  },

    ()=>({title:tx(t3('Gedrehte Zahlen','Flipped numbers','Números dados la vuelta')),text:tx(t3(`Leo rechnet ${fmt(1234)} · 6 und ${fmt(4321)} · 6. Wie groß ist der Unterschied zwischen den beiden Ergebnissen?`,`Leo works out ${fmt(1234)} · 6 and ${fmt(4321)} · 6. What is the difference between the two answers?`,`Leo calcula ${fmt(1234)} · 6 y ${fmt(4321)} · 6. ¿Cuál es la diferencia entre los dos resultados?`)),

    ()=>({title:tx(t3('Lauter Siebenen','All sevens','Todo sietes')),text:tx(t3(`Welche Zahl musst du mit 7 malnehmen, damit ${fmt(777777)} herauskommt?`,`Which number times 7 gives ${fmt(777777)}?`,`¿Qué número por 7 da ${fmt(777777)}?`)),f:[[T('label_iam'),111111]],
      hint:tx(t3('7 · 1 = 7. Und 7 · 11 = 77 …','7 · 1 = 7. And 7 · 11 = 77 …','7 · 1 = 7. Y 7 · 11 = 77 …')),ans:fmt(111111),expl:`${fmt(111111)} · 7 = ${fmt(777777)}`})

/* =========================================================

{
const COL=['r','b','g','y'],CF=c=>c==='y'?'var(--star)':`var(--pv-${c})`;
const CNA={r:t3('rote','red','roja'),b:t3('blaue','blue','azul'),g:t3('grüne','green','verde'),y:t3('gelbe','yellow','amarilla')};
const CNN={r:t3('Rot','Red','Rojo'),b:t3('Blau','Blue','Azul'),g:t3('Grün','Green','Verde'),y:t3('Gelb','Yellow','Amarillo')};
const marbleTxt=c=>tx(t3(`eine ${tx(CNA[c])} Murmel`,`a ${tx(CNA[c])} marble`,`una canica ${tx(CNA[c])}`));
const W3={sure:t3('sicher','certain','seguro'),poss:t3('möglich','possible','posible'),imp:t3('unmöglich','impossible','imposible')};
function bagSVG(cnt){const list=[];COL.forEach(c=>{for(let i=0;i<(cnt[c]||0);i++)list.push(c);});const sh=shuffle(list),W=220,H=190;
  let s=`<path d="M70 50 Q40 60 30 120 Q28 175 110 178 Q192 175 190 120 Q180 60 150 50Z" fill="#f3e2c4" stroke="#b08a52" stroke-width="3"/><path d="M78 50 Q110 30 142 50" fill="none" stroke="#b08a52" stroke-width="4"/>`;
  const cols=Math.ceil(Math.sqrt(sh.length*1.4));sh.forEach((c,i)=>{const r=Math.floor(i/cols),k=i%cols,n=Math.min(cols,sh.length-r*cols);const x=110+(k-(n-1)/2)*22,y=150-r*22;s+=`<circle cx="${x}" cy="${y}" r="10" fill="${CF(c)}" stroke="#fff" stroke-width="2"/>`;});
  return svgBox(W,H,s,'lsvg').replace('class="lsvg"','class="lsvg" style="max-width:240px"');}
function spinSVG(secs){const n=secs.length,R=80,cx=100,cy=100;let s='';secs.forEach((c,i)=>{const a0=2*Math.PI*i/n-Math.PI/2,a1=2*Math.PI*(i+1)/n-Math.PI/2,la=n<=2?1:0;
  s+=`<path d="M${cx} ${cy} L${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A${R} ${R} 0 ${n===1?1:0} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}Z" fill="${CF(c)}" stroke="#fff" stroke-width="3"/>`;});
  s+=`<circle cx="${cx}" cy="${cy}" r="8" fill="var(--ink)"/><path d="M${cx} ${cy} L${cx+30} ${cy-50}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  return svgBox(200,200,s,'lsvg').replace('class="lsvg"','class="lsvg" style="max-width:220px"');}
function randBag(){const k=rnd(1,3),cs=shuffle(COL).slice(0,k),cnt={};cs.forEach(c=>cnt[c]=rnd(1,6));return cnt;}
const DICE=[[t3('eine gerade Zahl','an even number','un número par'),3],[t3('eine ungerade Zahl','an odd number','un número impar'),3],[t3('eine Zahl größer als 4','a number greater than 4','un número mayor que 4'),2],[t3('eine Zahl kleiner als 3','a number less than 3','un número menor que 3'),2],
  [t3('eine 6','a 6','un 6'),1],[t3('mindestens eine 3','at least a 3','al menos un 3'),4],[t3('eine 7','a 7','un 7'),0],[t3('eine Zahl von 1 bis 6','a number from 1 to 6','un número del 1 al 6'),6]];
const COMBO=[[t3('T-Shirts','T-shirts','camisetas'),t3('Hosen','pairs of trousers','pantalones'),t3('Wie viele verschiedene Outfits kann Leo anziehen?','How many different outfits can Leo wear?','¿Cuántos conjuntos distintos puede ponerse Leo?')],
  [t3('Eissorten','ice-cream flavours','sabores de helado'),t3('Streusel-Sorten','kinds of sprinkles','tipos de virutas'),t3('Wie viele verschiedene Eis mit genau einer Sorte und einem Streusel gibt es?','How many different ice creams with exactly one flavour and one kind of sprinkles are there?','¿Cuántos helados distintos con un sabor y un tipo de virutas hay?')],
  [t3('Brotsorten','kinds of bread','tipos de pan'),t3('Beläge','fillings','rellenos'),t3('Wie viele verschiedene Brote mit einem Belag kann man machen?','How many different sandwiches with one filling can you make?','¿Cuántos bocadillos distintos con un relleno se pueden hacer?')]];
defLesson('chance',{
  h1:t3('<span>Zufall</span> und Wahrscheinlichkeit','<span>Chance</span> and probability','<span>Azar</span> y probabilidad'),
  intro:t3('Hallo! Was kommt beim Würfeln? Welche Murmel ziehe ich aus dem Beutel? Ganz genau weiß man das nie. Aber man kann sagen, was wahrscheinlich ist!',
    'Hi! What will the dice show? Which marble will I pull out of the bag? You never know for sure. But you can say what is likely!',
    '¡Hola! ¿Qué saldrá en el dado? ¿Qué canica sacaré de la bolsa? Nunca se sabe seguro. ¡Pero se puede decir qué es probable!'),
  steps:[
    {t:t3('Sicher oder unmöglich','Certain or impossible','Seguro o imposible'),v:()=>bagSVG({r:6}),
     say:t3('Im Beutel sind nur rote Murmeln. Leo zieht ohne hinzusehen eine heraus. Dass sie rot ist, ist sicher. Dass sie grün ist, ist unmöglich.',
       'There are only red marbles in the bag. Leo pulls one out without looking. That it is red is certain. That it is green is impossible.',
       'En la bolsa solo hay canicas rojas. Leo saca una sin mirar. Que sea roja es seguro. Que sea verde es imposible.')},
    {t:t3('Möglich und wahrscheinlich','Possible and likely','Posible y probable'),v:()=>bagSVG({r:7,b:1}),
     say:t3('Jetzt sind 7 rote und 1 blaue Murmel im Beutel. Rot ist möglich, Blau auch. Aber Rot ist viel wahrscheinlicher, weil viel mehr rote Murmeln drin sind.',
       'Now there are 7 red marbles and 1 blue one in the bag. Red is possible and so is blue. But red is much more likely, because there are many more red marbles.',
       'Ahora hay 7 canicas rojas y 1 azul. Roja es posible, y azul también. Pero roja es mucho más probable, porque hay muchas más rojas.')},
    {t:t3('Das Glücksrad','The spinner','La ruleta'),v:()=>spinSVG(['y','g','y','y','g','y']),
     say:t3('Auf Leos Glücksrad sind 4 Felder gelb und 2 Felder grün. Alle Felder sind gleich groß. Gelb kommt öfter, weil es mehr gelbe Felder gibt.',
       'Leo’s spinner has 4 yellow sections and 2 green ones. All the sections are the same size. Yellow comes up more often because there are more yellow sections.',
       'La ruleta de Leo tiene 4 casillas amarillas y 2 verdes. Todas son iguales de grandes. El amarillo sale más porque hay más casillas amarillas.')},
    {t:t3('Ist das Spiel fair?','Is the game fair?','¿Es justo el juego?'),v:()=>spinSVG(['y','g','y','g']),
     say:t3('Ein Spiel ist fair, wenn alle die gleiche Chance haben. Leo gewinnt bei Gelb, Mia bei Grün. Auf diesem Rad gibt es 2 gelbe und 2 grüne Felder. Also ist das Spiel fair.',
       'A game is fair if everyone has the same chance. Leo wins on yellow, Mia on green. This spinner has 2 yellow and 2 green sections. So the game is fair.',
       'Un juego es justo si todos tienen la misma oportunidad. Leo gana con amarillo y Mia con verde. Esta ruleta tiene 2 casillas amarillas y 2 verdes. Así que el juego es justo.')},
    {t:t3('Leos Trick','Leo’s trick','El truco de Leo'),eq:t3('Alle Möglichkeiten zählen','Count all the possibilities','Cuenta todas las posibilidades'),v:()=>['⚀','⚁','⚂','⚃','⚄','⚅'].map(d=>`<span style="font-size:2.6rem;line-height:1">${d}</span>`).join(' '),
     say:t3('Zähle alle Möglichkeiten. Ein Würfel hat 6 Seiten. Gerade Zahlen sind 2, 4 und 6, also 3 Möglichkeiten. Wer mehr Möglichkeiten zum Gewinnen hat, hat die bessere Chance.',
       'Count all the possibilities. A dice has 6 sides. The even numbers are 2, 4 and 6, so 3 possibilities. Whoever has more ways to win has the better chance.',
       'Cuenta todas las posibilidades. Un dado tiene 6 caras. Los pares son 2, 4 y 6: 3 posibilidades. Quien tiene más maneras de ganar tiene más oportunidades.')}
  ],
  remember:()=>({
    rule:`<span>${tx(W3.sure)}</span>: ${tx(t3('passiert auf jeden Fall','always happens','pasa siempre'))}<br><span>${tx(W3.poss)}</span>: ${tx(t3('kann passieren','can happen','puede pasar'))}<br><span>${tx(W3.imp)}</span>: ${tx(t3('kann nie passieren','can never happen','no puede pasar nunca'))}<p class="rulecap">${tx(t3('Je mehr Möglichkeiten für ein Ergebnis, desto wahrscheinlicher ist es. Fair ist ein Spiel, wenn alle gleich viele Möglichkeiten haben.','The more ways there are to get a result, the more likely it is. A game is fair if everyone has the same number of ways to win.','Cuantas más posibilidades tiene un resultado, más probable es. Un juego es justo si todos tienen las mismas posibilidades.'))}</p>`,
    p:'',ways:''
  }),
  quiz:{

{
function divSteps(n,d){const s=String(n),rows=[];let cur=0,started=false,first=true;
  for(let i=0;i<s.length;i++){const prev=cur;cur=cur*10+ +s[i];
    if(!started&&cur<d&&i<s.length-1)continue;
    if(!first)rows.push({t:(prev===0?'0':String(prev))+s[i],e:i});
    started=true;first=false;const q=Math.floor(cur/d),sub=q*d;rows.push({t:'−'+sub,e:i,u:1});cur-=sub;}
  rows.push({t:String(cur),e:s.length-1});return rows;}
function divHTML(n,d){const s=String(n),q=Math.floor(n/d),r=n%d,C=s.length+1,rows=divSteps(n,d);
  const line=(t,e,u)=>{const cells=Array(C).fill('');const st=e+1-(t.length-1);[...t].forEach((ch,k)=>cells[st+k]=ch);return `<tr>${cells.map((c,k)=>`<td${u&&k>=st&&k<=e+1?' class="u"':''}>${c}</td>`).join('')}</tr>`;};
  return `<div class="tw"><table class="divt"><tr><td></td>${[...s].map(c=>`<td>${c}</td>`).join('')}<td class="w">: ${d} = ${q}${r?` ${tx(t3('Rest','R','resto'))} ${r}`:''}</td></tr>`+rows.map(x=>line(x.t,x.e,x.u)).join('')+`</table></div>`;}
function exact(){for(;;){const d=rnd(2,9),q=rnd(12,9999),n=q*d;if(n>=100&&n<=99999)return [n,d];}}

function divTask(n,d,rest){const q=Math.floor(n/d),r=n%d,s=String(n),qs=String(q),L=s.length,want=[...Array(L)].map((_,j)=>{const i=L-1-j;return qs[qs.length-1-i]||'';});

{
function rectCells(w,h){const c=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)c.push([x,y]);return c;}
function shape(){const t=rnd(0,2),w=rnd(3,7),h=rnd(2,5);let c=rectCells(w,h);
  if(t===1){const cw=rnd(1,w-2),ch=rnd(1,h-1);c=c.filter(([x,y])=>!(x>=w-cw&&y<ch));}
  if(t===2&&w>=4){const cx=rnd(1,w-3),cw=rnd(1,w-cx-2);c=c.filter(([x,y])=>!(y===0&&x>=cx&&x<cx+cw));}
  return c;}
function perim(c){const set=new Set(c.map(p=>p.join(',')));let p=0;c.forEach(([x,y])=>{[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{if(!set.has((x+dx)+','+(y+dy)))p++;});});return p;}
function shapeSVG(c,col,showP){const s=30,W=Math.max(...c.map(p=>p[0]))+1,H=Math.max(...c.map(p=>p[1]))+1,PW=(W+2)*s,PH=(H+2)*s;let g='';
  for(let i=0;i<=W+2;i++)g+=`<line x1="${i*s}" y1="0" x2="${i*s}" y2="${PH}" stroke="var(--grid)" stroke-width="1.5"/>`;for(let j=0;j<=H+2;j++)g+=`<line x1="0" y1="${j*s}" x2="${PW}" y2="${j*s}" stroke="var(--grid)" stroke-width="1.5"/>`;
  const set=new Set(c.map(p=>p.join(',')));c.forEach(([x,y])=>{g+=`<rect x="${(x+1)*s}" y="${(y+1)*s}" width="${s}" height="${s}" fill="color-mix(in srgb,var(--pv-${col||'g'}) 45%,#fff)" stroke="#fff" stroke-width="2.5"/>`;});
  c.forEach(([x,y])=>{const X=(x+1)*s,Y=(y+1)*s;[[0,-1,X,Y,X+s,Y],[0,1,X,Y+s,X+s,Y+s],[-1,0,X,Y,X,Y+s],[1,0,X+s,Y,X+s,Y+s]].forEach(([dx,dy,a,b,cc,d])=>{if(!set.has((x+dx)+','+(y+dy)))g+=`<line x1="${a}" y1="${b}" x2="${cc}" y2="${d}" stroke="var(--pv-${showP?'r':(col||'g')})" stroke-width="${showP?4:3}" stroke-linecap="round"/>`;});});
  return svgBox(PW,PH,g,'lsvg').replace('class="lsvg"',`class="lsvg" style="max-width:${Math.min(460,PW*1.3)}px"`);}

function scaleSVG(v){const max=1000,W=260,H=180,cx=130,cy=152,R=118;let s=`<path d="M${cx-R-8} ${cy+6} A${R+8} ${R+8} 0 0 1 ${cx+R+8} ${cy+6}Z" fill="#fff" stroke="var(--ink)" stroke-width="2"/>`;
  for(let i=0;i<=20;i++){const a=Math.PI+Math.PI*i/20,maj=i%4===0,mid=i%2===0,r1=maj?R-18:mid?R-12:R-7;s+=`<line x1="${cx+R*Math.cos(a)}" y1="${cy+R*Math.sin(a)}" x2="${cx+r1*Math.cos(a)}" y2="${cy+r1*Math.sin(a)}" stroke="var(--ink)" stroke-width="${maj?2.6:mid?1.8:1.1}"/>`;}
  const a=Math.PI+Math.PI*v/max;s+=`<line x1="${cx}" y1="${cy}" x2="${cx+(R-4)*Math.cos(a)}" y2="${cy+(R-4)*Math.sin(a)}" stroke="var(--pen)" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="var(--pen)"/>`;
  for(let i=0;i<=20;i+=4){const a=Math.PI+Math.PI*i/20;s+=`<text x="${cx+(R-36)*Math.cos(a)}" y="${cy+(R-36)*Math.sin(a)+(i===0||i===20?-4:5)}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)" stroke="#fff" stroke-width="4" paint-order="stroke" font-family="Nunito,sans-serif">${fmt(i*50)}</text>`;}
  s+=`<text x="${cx}" y="${cy-28}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--muted)" font-family="Nunito,sans-serif">g</text>`;
  return svgBox(W,H,s,'lsvg').replace('class="lsvg"','class="lsvg" style="max-width:320px"');}
defLesson('weights',{

      const g=rnd(1,9)*1000+rnd(1,999);return decTask(tx(t3(`Schreibe <b>${fmt(g)} g</b> mit Komma in Kilogramm.`,`Write <b>${fmt(g)} g</b> in kilograms with a decimal point.`,`Escribe <b>${fmt(g)} g</b> en kilos con coma.`)),'',g/1000,`<b>${fmtDec(g/1000,3)} kg</b>`,tx(t3('Die Tausender werden Kilogramm, die letzten 3 Ziffern kommen hinter das Komma.','The thousands become kilograms, the last 3 digits go after the point.','Los millares son kilos, las 3 últimas cifras van después de la coma.')),'kg');}},
    gw_bruch:{l:t3('Halbe und Viertel','Halves and quarters','Medios y cuartos'),f(){const [s,v]=pick([['½',500],['¼',250],['¾',750]]),w=rnd(0,5),show=(w?w+' ':'')+s+' kg';

  riddles:{
    laster(){const L=pick([6,7.5,9,12]),k=pick([250,500,300]),n=Math.floor(L*1000/k);return {title:tx(t3('Der Lastwagen','The lorry','El camión')),text:tx(t3(`Ein Lastwagen darf ${fmtDec(L,L%1?1:0)} t laden. Eine Kiste wiegt ${k} kg. Wie viele Kisten darf er höchstens laden?`,`A lorry may carry ${fmtDec(L,L%1?1:0)} t. A crate weighs ${k} kg. How many crates may it carry at most?`,`Un camión puede cargar ${fmtDec(L,L%1?1:0)} t. Una caja pesa ${k} kg. ¿Cuántas cajas puede cargar como máximo?`)),

    waage(){const a=rnd(2,4),x=rnd(5,30)*10,b=rnd(1,4)*100;return {title:tx(t3('Die Balkenwaage','The balance','La balanza')),text:tx(t3(`Auf der einen Seite liegen ${a} gleiche Äpfel und ein ${b}-g-Gewicht. Auf der anderen Seite liegen ${a*x+b} g. Die Waage ist im Gleichgewicht. Wie schwer ist ein Apfel?`,`On one side there are ${a} identical apples and a ${b} g weight. On the other side there are ${a*x+b} g. The balance is level. How heavy is one apple?`,`En un lado hay ${a} manzanas iguales y una pesa de ${b} g. En el otro hay ${a*x+b} g. La balanza está equilibrada. ¿Cuánto pesa una manzana?`)),

{
const VOBJ=[[t3('eine Badewanne','a bathtub','una bañera'),'l'],[t3('ein Eimer','a bucket','un cubo'),'l'],[t3('ein Teelöffel','a teaspoon','una cucharita'),'ml'],[t3('eine Tasse','a cup','una taza'),'ml'],[t3('ein Aquarium','a fish tank','un acuario'),'l'],[t3('eine Medizinflasche','a medicine bottle','un frasco de jarabe'),'ml'],[t3('ein Planschbecken','a paddling pool','una piscina hinchable'),'l'],[t3('ein Joghurtbecher','a yoghurt pot','un vasito de yogur'),'ml']];
function jugSVG(v,max){const W=170,H=230,x0=40,x1=130,yb=210,yt=30,k=(yb-yt)/max;let s=`<path d="M${x0} ${yt-10} L${x0} ${yb} Q${x0} ${yb+8} ${x0+8} ${yb+8} L${x1-8} ${yb+8} Q${x1} ${yb+8} ${x1} ${yb} L${x1} ${yt-10}" fill="#fff" stroke="var(--ink)" stroke-width="2.5"/>`;
  s+=`<rect x="${x0+2}" y="${yb-v*k}" width="${x1-x0-4}" height="${v*k+6}" fill="color-mix(in srgb,var(--pv-b) 40%,#fff)"/>`;
  for(let m=0;m<=max;m+=max/10){const y=yb-m*k,maj=m%(max/2)===0||max/10*2===m||m%(max/5)===0;s+=`<line x1="${x1}" y1="${y}" x2="${x1-(maj?22:12)}" y2="${y}" stroke="var(--ink)" stroke-width="${maj?2:1.2}"/>`;if(m%(max/5)===0&&m)s+=`<text x="${x1+6}" y="${y+5}" font-size="13" font-weight="800" fill="var(--ink)" font-family="Nunito,sans-serif">${fmt(m)}</text>`;}
  s+=`<text x="${x1+6}" y="${yb+5}" font-size="12" font-weight="700" fill="var(--muted)" font-family="Nunito,sans-serif">ml</text>`;
  return svgBox(W,H,s,'lsvg').replace('class="lsvg"','class="lsvg" style="max-width:190px"');}

{

function clockSVG(h,m){const W=200,cx=100,cy=100,R=88;let s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff" stroke="var(--ink)" stroke-width="4"/>`;
  for(let i=0;i<60;i++){const a=i*6*DEG,r1=i%5===0?R-14:R-7;s+=`<line x1="${cx+(R-3)*Math.sin(a)}" y1="${cy-(R-3)*Math.cos(a)}" x2="${cx+r1*Math.sin(a)}" y2="${cy-r1*Math.cos(a)}" stroke="var(--ink)" stroke-width="${i%5===0?3:1.2}"/>`;}
  for(let i=1;i<=12;i++){const a=i*30*DEG;s+=`<text x="${cx+(R-28)*Math.sin(a)}" y="${cy-(R-28)*Math.cos(a)+6}" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)" font-family="Nunito,sans-serif">${i}</text>`;}
  const ha=((h%12)+m/60)*30*DEG,ma=m*6*DEG;
  s+=`<line x1="${cx}" y1="${cy}" x2="${cx+46*Math.sin(ha)}" y2="${cy-46*Math.cos(ha)}" stroke="var(--pv-r)" stroke-width="7" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${cx+70*Math.sin(ma)}" y2="${cy-70*Math.cos(ma)}" stroke="var(--pv-b)" stroke-width="4.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="var(--ink)"/>`;
  return svgBox(W,W,s,'lsvg').replace('class="lsvg"','class="lsvg" style="max-width:220px"');}

  pro:[

/* =========================================================
   LESSON: Würfel und Rauminhalt

{
const cubeFig=(W,D,H,col,max)=>{const m=max||220,s=Math.min(30,m/((W+D)*0.866),m*0.85/((W+D)*0.5+H));return `<span class="cubefig">${isoBox(W,D,H,s,col||pick(['g','b','r']))}</span>`;};
const row=html=>`<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:center">${html}</div>`;
const lab=(svg,t)=>`<figure style="margin:0;display:grid;justify-items:center;gap:4px">${svg}<figcaption style="font-weight:800">${t}</figcaption></figure>`;
const dims=()=>{const a=rnd(2,5),b=rnd(1,4),c=rnd(1,4);return [a,b,c];};
const SCHICHT=t3('Schichten','layers','capas');
function triples(n){const out=[];for(let a=1;a<=n;a++)for(let b=1;b<=a;b++)for(let c=1;c<=b;c++)if(a*b*c===n&&a<=8)out.push([a,b,c]);return out;}
defLesson('cubes',{
  h1:t3('Würfel und <span>Rauminhalt</span>','Cubes and <span>volume</span>','Cubos y <span>volumen</span>'),
  intro:t3('Hallo! Wie viel passt in eine Kiste? Heute bauen wir Quader aus kleinen Würfeln und zählen sie ganz geschickt.',
    'Hi! How much fits into a box? Today we build cuboids from small cubes and count them the clever way.',
    '¡Hola! ¿Cuánto cabe en una caja? Hoy construimos prismas con cubitos y los contamos de forma inteligente.'),
  steps:[
    {t:t3('Der kleine Würfel','The small cube','El cubito'),v:()=>cubeFig(1,1,1,'b',90),
     say:t3('Dieser kleine Würfel ist unser Maß. Wir schauen, wie viele kleine Würfel in einen Körper passen. Diese Zahl nennt man den Rauminhalt.',
       'This small cube is our unit. We look at how many small cubes fit into a solid. That number is called the volume.',
       'Este cubito es nuestra unidad. Miramos cuántos cubitos caben en un cuerpo. Ese número se llama volumen.')},
    {t:t3('Eine Schicht','One layer','Una capa'),eq:()=>'5 · 2 = 10',v:()=>cubeFig(5,2,1,'g'),

    {t:t3('Schicht auf Schicht','Layer on layer','Capa sobre capa'),eq:()=>'5 · 2 · 3 = 30',v:()=>cubeFig(5,2,3,'r'),
     say:t3('Jetzt stapeln wir 3 solche Schichten übereinander. Jede Schicht hat 10 Würfel. 3 mal 10 sind 30 Würfel. Kurz: Länge mal Breite mal Höhe.',
       'Now we stack 3 of these layers on top of each other. Each layer has 10 cubes. 3 times 10 makes 30 cubes. In short: length times width times height.',
       'Ahora apilamos 3 capas iguales. Cada capa tiene 10 cubitos. 3 por 10 son 30 cubitos. En corto: largo por ancho por alto.')},
    {t:t3('Gleich viel, andere Form','Same amount, different shape','Lo mismo, otra forma'),v:()=>row(lab(cubeFig(6,2,1,'g',130),'6 · 2 · 1')+lab(cubeFig(3,2,2,'b',130),'3 · 2 · 2')+lab(cubeFig(2,1,6,'r',130),'2 · 1 · 6')),
     say:t3('Aus 12 Würfeln kann Leo ganz verschiedene Quader bauen: flach, würfelig oder hoch wie ein Turm. Alle haben denselben Rauminhalt: 12 Würfel.',

       'Con 12 cubitos Leo puede construir prismas muy distintos: planos, gorditos o altos como una torre. Todos tienen el mismo volumen: 12 cubitos.')},
    {t:t3('Leos Trick','Leo’s trick','El truco de Leo'),eq:t3('10 cm · 10 cm · 10 cm passt genau 1 l → 1 l Wasser wiegt 1 kg','10 cm · 10 cm · 10 cm holds exactly 1 l → 1 l of water weighs 1 kg','10 cm · 10 cm · 10 cm caben justo 1 l → 1 l de agua pesa 1 kg'),v:()=>card('1 l','b')+arrowSym('⚖')+card('1 kg','r'),
     say:t3('Ein Würfel, der innen 10 Zentimeter lang, breit und hoch ist, fasst genau 1 Liter. Und 1 Liter Wasser wiegt 1 Kilogramm. Ein halber Liter Wasser wiegt also 500 Gramm.',

  remember:()=>({rule:tx(t3('<span>Rauminhalt = Länge · Breite · Höhe</span><br>(Würfel in einer Reihe · Reihen · Schichten)<br>1 l Wasser wiegt 1 kg',

    '<span>Volumen = largo · ancho · alto</span><br>(cubitos por fila · filas · capas)<br>1 l de agua pesa 1 kg')),p:'',ways:''}),
  quiz:{
    count(){const [a,b,c]=dims(),n=a*b*c;return mkQ(tx(t3('Wie viele kleine Würfel hat der Quader?','How many small cubes does the cuboid have?','¿Cuántos cubitos tiene el prisma?'))+cubeFig(a,b,c,null,170),n,[...new Set([a*b,a+b+c,n+a*b,n-a].filter(x=>x>0&&x!==n))],`${a} · ${b} · ${c} = ${n}`);},
    layer(){const l=rnd(4,12),s=rnd(2,5);return mkQ(tx(t3(`Eine Schicht hat ${l} Würfel. Der Quader ist ${s} Schichten hoch. Wie viele Würfel sind es?`,`One layer has ${l} cubes. The cuboid is ${s} layers high. How many cubes is that?`,`Una capa tiene ${l} cubitos. El prisma tiene ${s} capas. ¿Cuántos cubitos son?`)),l*s,[l+s,l*s+l,l*s-s],`${s} · ${l} = ${l*s}`);},
    water(){const n=pick([2,3,5,10,20]);return mkQ(tx(t3(`Wie schwer sind ${n} l Wasser?`,`How heavy are ${n} l of water?`,`¿Cuánto pesan ${n} l de agua?`)),n+' kg',[`${n} g`,`${n*10} kg`,`${n*100} g`],tx(t3('1 l Wasser wiegt 1 kg.','1 l of water weighs 1 kg.','1 l de agua pesa 1 kg.')));},
    same(){const n=pick([12,18,24,30,36]),ts=triples(n),c=pick(ts),w=[];while(w.length<3){const t=[rnd(1,6),rnd(1,5),rnd(1,4)],p=t[0]*t[1]*t[2];if(p!==n&&Math.abs(p-n)<=12&&!w.includes(t.join(' · ')))w.push(t.join(' · '));}
      return mkQ(tx(t3(`Welcher Quader besteht aus ${n} Würfeln?`,`Which cuboid is made of ${n} cubes?`,`¿Qué prisma tiene ${n} cubitos?`)),c.join(' · '),w,`${c.join(' · ')} = ${n}`);}
  },
  gen:{
    wf_zaehlen:{l:t3('Würfel zählen','Counting cubes','Contar cubitos'),f(){const [a,b,c]=dims(),n=a*b*c;return numTask(tx(t3('Wie viele kleine Würfel hat der Quader?','How many small cubes does the cuboid have?','¿Cuántos cubitos tiene el prisma?')),cubeFig(a,b,c),n,`${a} · ${b} · ${c} = <b>${n}</b>`,
      tx(t3('Zähle eine Reihe, dann die Reihen einer Schicht, dann die Schichten.','Count one row, then the rows in a layer, then the layers.','Cuenta una fila, luego las filas de una capa y luego las capas.')));}},
    wf_rechnen:{l:t3('Quader berechnen','Working out cuboids','Calcular prismas'),f(){const a=rnd(3,9),b=rnd(2,6),c=rnd(2,5),n=a*b*c;return numTask(tx(t3(`Ein Quader ist <b>${a}</b> Würfel lang, <b>${b}</b> Würfel breit und <b>${c}</b> Würfel hoch. Aus wie vielen Würfeln besteht er?`,`A cuboid is <b>${a}</b> cubes long, <b>${b}</b> cubes wide and <b>${c}</b> cubes high. How many cubes is it made of?`,`Un prisma mide <b>${a}</b> cubitos de largo, <b>${b}</b> de ancho y <b>${c}</b> de alto. ¿Cuántos cubitos tiene?`)),'',n,`${a} · ${b} · ${c} = <b>${n}</b>`,
      tx(t3(`Eine Schicht: ${a} · ${b}. Dann mal ${c}.`,`One layer: ${a} · ${b}. Then times ${c}.`,`Una capa: ${a} · ${b}. Luego por ${c}.`)));}},
    wf_hoehe:{l:t3('Wie hoch?','How high?','¿Qué altura?'),f(){const a=rnd(2,6),b=rnd(2,5),c=rnd(2,6),n=a*b*c;return numTask(tx(t3(`Ein Quader besteht aus <b>${n}</b> Würfeln. Unten liegen <b>${a} · ${b}</b> Würfel. Wie viele Schichten ist er hoch?`,`A cuboid is made of <b>${n}</b> cubes. At the bottom there are <b>${a} · ${b}</b> cubes. How many layers high is it?`,`Un prisma tiene <b>${n}</b> cubitos. Abajo hay <b>${a} · ${b}</b> cubitos. ¿Cuántas capas tiene?`)),'',c,`${n} : ${a*b} = <b>${c}</b>`,
      tx(t3(`Eine Schicht hat ${a*b} Würfel. Wie oft passt ${a*b} in ${n}?`,`One layer has ${a*b} cubes. How many times does ${a*b} go into ${n}?`,`Una capa tiene ${a*b} cubitos. ¿Cuántas veces cabe ${a*b} en ${n}?`)),tx(SCHICHT));}},
    wf_bauen:{l:t3('Quader bauen','Building cuboids','Construir prismas'),f(){const n=pick([12,16,18,20,24,30,36]),c=pick(triples(n)).join(' · '),w=new Set();while(w.size<3){const t=[rnd(1,6),rnd(1,5),rnd(1,4)],p=t[0]*t[1]*t[2];if(p!==n&&Math.abs(p-n)<=10)w.add(t.join(' · '));}
      return mcTask(tx(t3(`Leo hat <b>${n}</b> Würfel und baut damit einen Quader. Welche Maße kann der Quader haben?`,`Leo has <b>${n}</b> cubes and builds one cuboid with them. Which measurements can it have?`,`Leo tiene <b>${n}</b> cubitos y construye un prisma. ¿Qué medidas puede tener?`)),'',[c,...w],c,null,`<b>${c} = ${n}</b>`,
        tx(t3('Rechne bei jeder Antwort das Produkt aus.','Work out the product for each answer.','Calcula el producto de cada respuesta.')));}},
    wf_wasser:{l:t3('Wasser wiegen','Weighing water','Pesar agua'),f(){if(Math.random()<.5){const [o,l]=pick([[t3('ein Aquarium','A fish tank','Un acuario'),pick([40,60,80,120])],[t3('ein Planschbecken','A paddling pool','Una piscina hinchable'),pick([200,300,450])],[t3('eine Gießkanne','A watering can','Una regadera'),pick([5,8,10])],[t3('ein Eimer','A bucket','Un cubo'),pick([10,12])]]);
        return numTask(tx(t3(`${tx(o).replace(/^./,c=>c.toUpperCase())} fasst <b>${l} l</b> Wasser. Wie schwer ist das Wasser?`,`${tx(o)} holds <b>${l} l</b> of water. How heavy is the water?`,`${tx(o)} contiene <b>${l} l</b> de agua. ¿Cuánto pesa el agua?`)),'',l,`<b>${l} kg</b>`,tx(t3('1 l Wasser wiegt 1 kg.','1 l of water weighs 1 kg.','1 l de agua pesa 1 kg.')),'kg');}
      const ml=pick([125,200,250,330,500,750]);return numTask(tx(t3(`Ein Glas mit <b>${ml} ml</b> Wasser. Wie viel wiegt das Wasser?`,`A glass with <b>${ml} ml</b> of water. How much does the water weigh?`,`Un vaso con <b>${ml} ml</b> de agua. ¿Cuánto pesa el agua?`)),'',ml,`<b>${ml} g</b>`,
        tx(t3('1 l = 1 000 ml wiegt 1 kg = 1 000 g. Also wiegt 1 ml genau 1 g.','1 l = 1,000 ml weighs 1 kg = 1,000 g. So 1 ml weighs exactly 1 g.','1 l = 1 000 ml pesa 1 kg = 1 000 g. Así que 1 ml pesa 1 g.')),'g');}}
  },
  riddles:{
    turm(){const n=rnd(2,5);return {title:tx(t3('Der große Würfel','The big cube','El cubo grande')),text:tx(t3(`Leo baut einen großen Würfel. Er ist ${n} kleine Würfel lang, ${n} breit und ${n} hoch. Wie viele kleine Würfel braucht er?`,`Leo builds a big cube. It is ${n} small cubes long, ${n} wide and ${n} high. How many small cubes does he need?`,`Leo construye un cubo grande de ${n} cubitos de largo, ${n} de ancho y ${n} de alto. ¿Cuántos cubitos necesita?`)),
      f:[[tx(t3('Würfel','Cubes','Cubitos')),n*n*n]],hint:`${n} · ${n} · ${n}`,ans:String(n*n*n),expl:`${n} · ${n} · ${n} = ${n*n*n}`};},
    schachtel(){const a=pick([4,5,6]),b=pick([3,4]),c=pick([2,3]),k=pick([2,3,4]);return {title:tx(t3('Die Zuckerdose','The sugar box','La caja de azúcar')),text:tx(t3(`In eine Schachtel passen unten ${a} · ${b} Zuckerwürfel, und es gibt ${c} Lagen. Leo nimmt jeden Tag ${k} Stück für seinen Tee. Für wie viele Tage reicht die volle Schachtel?`,`A box holds ${a} · ${b} sugar cubes on the bottom, and there are ${c} layers. Leo takes ${k} cubes for his tea every day. How many days does a full box last?`,`En una caja caben abajo ${a} · ${b} terrones de azúcar y hay ${c} capas. Leo toma ${k} cada día para su té. ¿Para cuántos días llega la caja llena?`)),

      f:[[tx(t3('Würfel','Cubes','Cubitos')),a*b*c-have]],hint:`${a} · ${b} · ${c} = ?`,ans:String(a*b*c-have),expl:`${a*b*c} − ${have} = ${a*b*c-have}`};}
  },
  pro:[
    ()=>({title:tx(t3('Der bunte Würfel','The painted cube','El cubo pintado')),text:tx(t3('Leo baut aus 27 kleinen Würfeln einen großen Würfel (3 · 3 · 3) und malt ihn außen rot an. Dann nimmt er ihn wieder auseinander. Wie viele kleine Würfel haben gar keine Farbe abbekommen?','Leo builds a big cube (3 · 3 · 3) from 27 small cubes and paints the outside red. Then he takes it apart again. How many small cubes got no paint at all?','Leo construye un cubo grande (3 · 3 · 3) con 27 cubitos y lo pinta de rojo por fuera. Luego lo desmonta. ¿Cuántos cubitos no tienen nada de pintura?')),f:[[tx(t3('Würfel','Cubes','Cubitos')),1]],
      hint:tx(t3('Welcher Würfel liegt ganz innen und berührt keine Außenseite?','Which cube lies right inside and touches no outer face?','¿Qué cubito está justo dentro y no toca ninguna cara exterior?')),ans:'1',expl:tx(t3('Nur der Würfel in der Mitte bleibt ohne Farbe.','Only the cube in the very middle stays unpainted.','Solo el cubito del centro queda sin pintar.'))}),
    ()=>({title:tx(t3('Drei Farben','Three colours','Tres colores')),text:tx(t3('Beim selben bunten Würfel aus 27 Würfeln: Wie viele kleine Würfel haben an genau 3 Seiten Farbe?','With the same painted cube made of 27 cubes: how many small cubes have paint on exactly 3 faces?','Con el mismo cubo pintado de 27 cubitos: ¿cuántos cubitos tienen pintura en exactamente 3 caras?')),f:[[tx(t3('Würfel','Cubes','Cubitos')),8]],

    ()=>({title:tx(t3('Der größte Würfel','The biggest cube','El cubo más grande')),text:tx(t3('Leo hat 70 kleine Würfel. Er baut daraus den größten Würfel, der geht (gleich lang, breit und hoch). Wie viele kleine Würfel bleiben übrig?','Leo has 70 small cubes. He builds the biggest possible cube (same length, width and height). How many small cubes are left over?','Leo tiene 70 cubitos. Construye el cubo más grande posible (igual de largo, ancho y alto). ¿Cuántos cubitos sobran?')),f:[[tx(t3('Würfel','Cubes','Cubitos')),6]],

/* =========================================================

{

const twoIn=(u1,u2)=>`<div class="eq">${numIn(true)}<span class="op">${u1}</span>${numIn(true)}<span class="op">${u2}</span></div>`;
const two=(q,pre,a,b,sol,hint,u1,u2)=>({q,body:(pre||'')+twoIn(u1,u2),check:v=>parseNum(v[0])===a&&parseNum(v[1])===b,perField:v=>[parseNum(v[0])===a,parseNum(v[1])===b],sol,hint,a:[String(a),String(b)]});
const mix=(v,f,big,small)=>Math.floor(v/f)+' '+big+(v%f?' '+fmt(v%f)+' '+small:'');
/* every kind of measure: base unit, formatters */
const KINDS={
  len:{b:'m',gen:()=>rnd(20,60)*50,f:[v=>fmt(v)+' m',v=>fmtDec(v/1000,3)+' km',v=>v%1000&&v>1000?mix(v,1000,'km','m'):null]},
  wgt:{b:'g',gen:()=>rnd(20,80)*50,f:[v=>fmt(v)+' g',v=>fmtDec(v/1000,3)+' kg',v=>v%1000&&v>1000?mix(v,1000,'kg','g'):null]},
  vol:{b:'ml',gen:()=>rnd(8,40)*125,f:[v=>fmt(v)+' ml',v=>fmtDec(v/1000,3)+' l',v=>v%1000&&v>1000?mix(v,1000,'l','ml'):null]},
  mon:{b:'ct',gen:()=>rnd(30,190)*5,f:[v=>fmt(v)+' ct',v=>euro(v),v=>v%100&&v>100?mix(v,100,'€','ct'):null]},
  tim:{b:'s',gen:()=>rnd(14,60)*5,f:[v=>v+' s',v=>v%60&&v>60?mix(v,60,'min','s'):null,v=>v%60===0?(v/60)+' min':null]}
};
function showIn(kind,v){const fs=KINDS[kind].f.map(f=>f(v)).filter(Boolean);return pick(fs);}
const PL=[
  [t3('Ein Schulbus ist etwa 12 ___ lang.','A school bus is about 12 ___ long.','Un autobús escolar mide unos 12 ___ de largo.'),'m',['mm','cm','m','km']],
  [t3('Ein Bleistift ist etwa 17 ___ lang.','A pencil is about 17 ___ long.','Un lápiz mide unos 17 ___.'),'cm',['mm','cm','m','km']],
  [t3('Eine Ameise ist etwa 5 ___ lang.','An ant is about 5 ___ long.','Una hormiga mide unos 5 ___.'),'mm',['mm','cm','m','km']],
  [t3('Von Berlin nach Hamburg sind es etwa 300 ___.','From Berlin to Hamburg it is about 300 ___.','De Berlín a Hamburgo hay unos 300 ___.'),'km',['cm','m','km']],

defLesson('convert',{
  h1:t3('Größen <span>umrechnen</span>','Converting <span>measures</span>','Convertir <span>medidas</span>'),
  intro:t3('Hallo! Euro, Meter, Kilogramm, Liter und Minuten: Das sind alles Größen. Heute springst du sicher zwischen allen Einheiten hin und her.',
    'Hi! Euros, metres, kilograms, litres and minutes: these are all measures. Today you learn to jump safely between all the units.',
    '¡Hola! Euros, metros, kilos, litros y minutos: todo son medidas. Hoy aprendes a saltar con seguridad entre todas las unidades.'),
  steps:[
    {t:t3('Alle Größen auf einen Blick','All measures at a glance','Todas las medidas de un vistazo'),v:TABLE,
     say:t3('Jede Größe hat ihre eigene Umrechnungszahl. Beim Geld ist es 100, bei Kilometer, Kilogramm und Liter meistens 1 000. Bei der Zeit ist es 60 oder 24.',
       'Every measure has its own conversion number. For money it is 100, for kilometres, kilograms and litres mostly 1,000. For time it is 60 or 24.',
       'Cada medida tiene su número de conversión. Para el dinero es 100; para kilómetros, kilos y litros casi siempre 1 000. Para el tiempo es 60 o 24.')},
    {t:t3('Achtung, kleine Reste!','Watch out for small leftovers!','¡Ojo con los restos pequeños!'),eq:()=>`4 € 5 ct = 405 ct · 2 km 30 m = ${fmt(2030)} m`,v:()=>card('4 € 5 ct','b')+arrowSym('=')+card('405 ct','g'),
     say:t3('4 Euro und 5 Cent sind 405 Cent, nicht 45 Cent! Der Rest braucht die richtigen Stellen. Genauso sind 2 Kilometer und 30 Meter 2 030 Meter.',
       '4 euros and 5 cents are 405 cents, not 45 cents! The leftover needs the right places. In the same way, 2 kilometres and 30 metres are 2,030 metres.',
       '4 euros y 5 céntimos son 405 céntimos, ¡no 45! El resto necesita sus cifras. Igual que 2 kilómetros y 30 metros son 2 030 metros.')},
    {t:t3('Zeit ist anders','Time is different','El tiempo es distinto'),eq:()=>'135 min = 2 h 15 min · 200 s = 3 min 20 s',v:()=>card('135 min','b')+arrowSym('=')+card('2 h 15 min','r'),
     say:t3('Bei der Zeit bündelt man immer 60. In 135 Minuten stecken zwei volle Stunden, das sind 120 Minuten. Es bleiben 15 Minuten übrig. Also 2 Stunden 15 Minuten.',
       'With time you always bundle 60. 135 minutes contain two full hours, which is 120 minutes. 15 minutes are left. So 2 hours 15 minutes.',
       'Con el tiempo siempre se agrupa de 60 en 60. En 135 minutos hay dos horas enteras, que son 120 minutos. Sobran 15 minutos. O sea 2 horas y 15 minutos.')},
    {t:t3('Größen ordnen','Ordering measures','Ordenar medidas'),eq:()=>`${fmtDec(1.2,1)} km = ${fmt(1200)} m · 1 km 50 m = ${fmt(1050)} m · ${fmt(1300)} m`,v:()=>card(fmt(1050)+' m','g')+arrowSym('&lt;')+card(fmt(1200)+' m','b')+arrowSym('&lt;')+card(fmt(1300)+' m','r'),
     say:t3('Welche Strecke ist am längsten: 1,2 Kilometer, 1 Kilometer 50 Meter oder 1 300 Meter? Leo schreibt alles in Metern: 1 200, 1 050 und 1 300. Jetzt sieht man es sofort.',
       'Which distance is the longest: 1.2 kilometres, 1 kilometre 50 metres or 1,300 metres? Leo writes everything in metres: 1,200, 1,050 and 1,300. Now you see it at once.',
       '¿Qué distancia es la más larga: 1,2 kilómetros, 1 kilómetro 50 metros o 1 300 metros? Leo lo pasa todo a metros: 1 200, 1 050 y 1 300. Ahora se ve enseguida.')},
    {t:t3('Leos Trick','Leo’s trick','El truco de Leo'),eq:t3('Kann das stimmen?','Can that be right?','¿Puede ser cierto?'),v:()=>card('🐕 30 g?','r')+arrowSym('→')+card('30 kg','g'),
     say:t3('Bevor du rechnest, frag dich: Passt die Zahl zur Sache? Ein Hund mit 30 Gramm wäre leichter als ein Ei. 30 Kilogramm passt viel besser.',
       'Before you calculate, ask yourself: does the number fit the thing? A dog weighing 30 grams would be lighter than an egg. 30 kilograms fits much better.',
       'Antes de calcular, pregúntate: ¿encaja el número con la cosa? Un perro de 30 gramos pesaría menos que un huevo. 30 kilos encaja mucho mejor.')}
  ],
  remember:()=>({rule:[['1 € = 100 ct'],[`1 km = ${fmt(1000)} m`,'1 m = 100 cm','1 cm = 10 mm'],[`1 t = ${fmt(1000)} kg`,`1 kg = ${fmt(1000)} g`],[`1 l = ${fmt(1000)} ml`],[`1 ${tx(t3('Tag','day','día'))} = 24 h`,'1 h = 60 min','1 min = 60 s']].map(g=>g.map(x=>x.replace(/ /g,'&nbsp;')).join(' · ')).join('<br>'),
    p:tx(t3('Zum Vergleichen schreibst du alles in derselben Einheit.','To compare, write everything in the same unit.','Para comparar, escríbelo todo en la misma unidad.')),ways:''}),
  quiz:{
    euro(){const e=rnd(1,9),c=pick([5,8,40,75,99,3]);return mkQ(tx(t3(`Wie viele Cent sind ${e} € ${c} ct?`,`How many cents are ${e} € ${c} ct?`,`¿Cuántos céntimos son ${e} € ${c} ct?`)),(e*100+c)+' ct',[`${e}${c} ct`,`${e*10+c} ct`,`${e*1000+c} ct`].filter(x=>x!==(e*100+c)+' ct'),'1 € = 100 ct');},
    mm(){const c=rnd(3,40);return mkQ(tx(t3(`Wie viele Millimeter sind ${c} cm?`,`How many millimetres are ${c} cm?`,`¿Cuántos milímetros son ${c} cm?`)),(c*10)+' mm',[c*100,c+10,c*1000].map(x=>fmt(x)+' mm'),'1 cm = 10 mm');},
    time(){const m=rnd(65,190);return mkQ(tx(t3(`Wie viel sind ${m} min?`,`How much is ${m} min?`,`¿Cuánto son ${m} min?`)),dur2(m),[`${Math.floor(m/100)} h ${m%100} min`,`${Math.floor(m/60)+1} h ${m%60} min`,`${Math.floor(m/60)} h ${(m%60+10)%60} min`],'1 h = 60 min');},
    plaus(){const [s,u,opts]=pick(PL);return mkQ(tx(s).replace('___','?'),u,opts,tx(t3('Stell dir die Sache vor.','Picture the thing.','Imagina la cosa.')));}
  },
  gen:{
    gu_geld:{l:t3('Euro und Cent','Euros and cents','Euros y céntimos'),f(){const t=rnd(0,2);
      if(t===0){const e=rnd(1,19),c=pick([rnd(1,9),rnd(10,99)]);return numTask(tx(t3(`Wie viele Cent sind <b>${e} € ${c} ct</b>?`,`How many cents are <b>${e} € ${c} ct</b>?`,`¿Cuántos céntimos son <b>${e} € ${c} ct</b>?`)),'',e*100+c,`<b>${fmt(e*100+c)} ct</b>`,tx(t3(`1 € = 100 ct. Achte auf die Stellen${c<10?`: ${c} ct sind 0${c}`:''}.`,`1 € = 100 ct. Mind the places${c<10?`: ${c} ct is 0${c}`:''}.`,`1 € = 100 ct. Cuidado con las cifras${c<10?`: ${c} ct son 0${c}`:''}.`)),'ct');}
      const c=rnd(101,1999);if(t===1)return decTask(tx(t3(`Schreibe <b>${fmt(c)} ct</b> in Euro mit Komma.`,`Write <b>${fmt(c)} ct</b> in euros with a decimal point.`,`Escribe <b>${fmt(c)} ct</b> en euros con coma.`)),'',c/100,`<b>${euro(c)}</b>`,tx(t3('Die letzten 2 Ziffern sind die Cent, sie kommen hinter das Komma.','The last 2 digits are the cents, they go after the point.','Las 2 últimas cifras son los céntimos, van después de la coma.')),'€');
      return numTask(tx(t3(`Wie viele Cent sind <b>${euro(c)}</b>?`,`How many cents are <b>${euro(c)}</b>?`,`¿Cuántos céntimos son <b>${euro(c)}</b>?`)),'',c,`<b>${fmt(c)} ct</b>`,tx(t3('Komma weg, fertig: Euro und Cent hintereinander geschrieben.','Remove the point: euros and cents written one after the other.','Quita la coma: euros y céntimos uno detrás del otro.')),'ct');}},
    gu_laenge:{l:t3('Längen umrechnen','Converting lengths','Convertir longitudes'),f(){const t=rnd(0,4);
      if(t===0){const k=rnd(1,9),m=pick([rnd(1,99),rnd(100,999)]);return numTask(tx(t3(`Wie viele Meter sind <b>${k} km ${m} m</b>?`,`How many metres are <b>${k} km ${m} m</b>?`,`¿Cuántos metros son <b>${k} km ${m} m</b>?`)),'',k*1000+m,`<b>${fmt(k*1000+m)} m</b>`,'1 km = 1 000 m'.replace('1 000',fmt(1000)),'m');}
      if(t===1){const m=rnd(1,20),c=rnd(1,99);return numTask(tx(t3(`Wie viele Zentimeter sind <b>${m} m ${c} cm</b>?`,`How many centimetres are <b>${m} m ${c} cm</b>?`,`¿Cuántos centímetros son <b>${m} m ${c} cm</b>?`)),'',m*100+c,`<b>${fmt(m*100+c)} cm</b>`,'1 m = 100 cm','cm');}
      if(t===2){const c=rnd(1,50),mm=rnd(1,9);return numTask(tx(t3(`Wie viele Millimeter sind <b>${c} cm ${mm} mm</b>?`,`How many millimetres are <b>${c} cm ${mm} mm</b>?`,`¿Cuántos milímetros son <b>${c} cm ${mm} mm</b>?`)),'',c*10+mm,`<b>${c*10+mm} mm</b>`,'1 cm = 10 mm','mm');}
      if(t===3){const m=rnd(1,9)*1000+rnd(1,99)*10;return decTask(tx(t3(`Schreibe <b>${fmt(m)} m</b> in Kilometern mit Komma.`,`Write <b>${fmt(m)} m</b> in kilometres with a decimal point.`,`Escribe <b>${fmt(m)} m</b> en kilómetros con coma.`)),'',m/1000,`<b>${fmtDec(m/1000,3)} km</b>`,tx(t3('Nach dem Komma stehen 3 Stellen für die Meter.','After the point there are 3 digits for the metres.','Después de la coma hay 3 cifras para los metros.')),'km');}
      const c=rnd(101,999);return decTask(tx(t3(`Schreibe <b>${c} cm</b> in Metern mit Komma.`,`Write <b>${c} cm</b> in metres with a decimal point.`,`Escribe <b>${c} cm</b> en metros con coma.`)),'',c/100,`<b>${fmtDec(c/100,2)} m</b>`,tx(t3('Nach dem Komma stehen 2 Stellen für die Zentimeter.','After the point there are 2 digits for the centimetres.','Después de la coma hay 2 cifras para los centímetros.')),'m');}},
    gu_zeit:{l:t3('Zeit bündeln','Bundling time','Agrupar el tiempo'),f(){if(Math.random()<.5){let m=rnd(61,299);while(m%60===0)m=rnd(61,299);return two(tx(t3(`Schreibe <b>${m} min</b> in Stunden und Minuten.`,`Write <b>${m} min</b> in hours and minutes.`,`Escribe <b>${m} min</b> en horas y minutos.`)),'',Math.floor(m/60),m%60,`<b>${Math.floor(m/60)} h ${m%60} min</b>`,
        tx(t3(`Wie viele volle 60er stecken in ${m}?`,`How many full 60s are in ${m}?`,`¿Cuántos 60 enteros hay en ${m}?`)),'h','min');}
      let s=rnd(61,359);while(s%60===0)s=rnd(61,359);return two(tx(t3(`Schreibe <b>${s} s</b> in Minuten und Sekunden.`,`Write <b>${s} s</b> in minutes and seconds.`,`Escribe <b>${s} s</b> en minutos y segundos.`)),'',Math.floor(s/60),s%60,`<b>${Math.floor(s/60)} min ${s%60} s</b>`,
        tx(t3('1 min = 60 s. Zähle 60, 120, 180, … ','1 min = 60 s. Count 60, 120, 180, …','1 min = 60 s. Cuenta 60, 120, 180, …')),'min','s');}},
    gu_klein:{l:t3('In die kleine Einheit','Into the small unit','A la unidad pequeña'),f(){const t=rnd(0,5),D1=tx(t3('Tag','day','día')),DN=tx(t3('Tage','days','días'));
      const [B,B1,S,f,a,b]=[['t','t','kg',1000,rnd(1,9),rnd(1,999)],['kg','kg','g',1000,rnd(1,9),rnd(1,999)],['l','l','ml',1000,rnd(1,9),rnd(1,999)],['h','h','min',60,rnd(1,9),rnd(1,59)],[DN,D1,'h',24,rnd(2,6),rnd(1,23)],['min','min','s',60,rnd(1,9),rnd(1,59)]][t],v=a*f+b;
      return numTask(tx(t3(`Rechne um: <b>${a} ${B} ${b} ${S}</b> = ? ${S}`,`Convert: <b>${a} ${B} ${b} ${S}</b> = ? ${S}`,`Convierte: <b>${a} ${B} ${b} ${S}</b> = ? ${S}`)),'',v,`${a} · ${fmt(f)} + ${b} = <b>${fmt(v)} ${S}</b>`,`1 ${B1} = ${fmt(f)} ${S}`,S);}},
    gu_ordnen:{l:t3('Größen vergleichen','Comparing measures','Comparar medidas'),f(){const kind=pick(Object.keys(KINDS)),K=KINDS[kind],vals=new Set();while(vals.size<4)vals.add(K.gen());const vs=[...vals],big=Math.random()<.5,ans=big?Math.max(...vs):Math.min(...vs);
      const shown=vs.map(v=>[v,showIn(kind,v)]),opts=shown.map(x=>x[1]),a=shown.find(x=>x[0]===ans)[1];
      return mcTask(big?tx(t3('Was ist <b>am meisten</b>?','Which is <b>the most</b>?','¿Qué es <b>lo mayor</b>?')):tx(t3('Was ist <b>am wenigsten</b>?','Which is <b>the least</b>?','¿Qué es <b>lo menor</b>?')),'',opts,a,null,
        shown.sort((x,y)=>x[0]-y[0]).map(x=>`${x[1]} = ${fmt(x[0])} ${K.b}`).join('<br>'),tx(t3(`Schreib alles in ${K.b}.`,`Write everything in ${K.b}.`,`Escríbelo todo en ${K.b}.`)));}},
    gu_passt:{l:t3('Was passt?','What fits?','¿Qué encaja?'),f(){const [s,u,opts]=pick(PL);return mcTask(tx(s).replace('___','<b>?</b>'),'',opts,u,null,`<b>${tx(s).replace('___',u)}</b>`,tx(t3('Stell dir die Sache vor: klein, mittel oder riesig?','Picture the thing: small, medium or huge?','Imagina la cosa: ¿pequeña, mediana o enorme?')));}},
    gu_gerundet:{l:t3('Genau oder gerundet?','Exact or rounded?','¿Exacto o redondeado?'),f(){const [s,k]=pick(GR),txt=tx(s()),a=k==='e'?EX():RO();return mcTask(tx(t3('Ist die Zahl <b>genau</b> oder <b>gerundet</b>?','Is the number <b>exact</b> or <b>rounded</b>?','¿El número es <b>exacto</b> o <b>redondeado</b>?')),`<p class="bignum" style="font-size:1.25rem">${txt}</p>`,[EX(),RO()],a,null,`<b>${a}</b>`,
      tx(t3('Wörter wie etwa, rund, ungefähr, fast oder ca. zeigen: gerundet. Preise, Hausnummern und Ergebnisse sind genau.','Words like about, around, roughly, nearly or approx. show: rounded. Prices, house numbers and scores are exact.','Palabras como unos, alrededor, casi o aprox. indican: redondeado. Precios, números de casa y resultados son exactos.')));}},
    gu_wasser:{l:t3('Rechnen mit Wasser','Calculating with water','Calcular con agua'),f(){const t=rnd(0,3);
      if(t===0){const n=rnd(2,5),k=pick([8,10,12]);return numTask(tx(t3(`Leo gießt den Garten jeden Tag mit <b>${n}</b> Kannen zu je <b>${k} l</b>. Wie viele Liter sind das in einer Woche?`,`Leo waters the garden every day with <b>${n}</b> cans of <b>${k} l</b> each. How many litres is that in one week?`,`Leo riega el jardín cada día con <b>${n}</b> regaderas de <b>${k} l</b>. ¿Cuántos litros son en una semana?`)),'',7*n*k,`7 · ${n} · ${k} = <b>${7*n*k} l</b>`,tx(t3('Erst ein Tag, dann mal 7.','First one day, then times 7.','Primero un día, luego por 7.')),'l');}
      if(t===1){const p=rnd(2,6);return numTask(tx(t3(`Ein Mensch braucht etwa <b>125 l</b> Wasser am Tag. Wie viel braucht eine Familie mit <b>${p}</b> Personen am Tag?`,`A person uses about <b>125 l</b> of water a day. How much does a family of <b>${p}</b> use per day?`,`Una persona gasta unos <b>125 l</b> de agua al día. ¿Cuánto gasta al día una familia de <b>${p}</b> personas?`)),'',125*p,`${p} · 125 = <b>${fmt(125*p)} l</b>`,`${p} · 125`,'l');}
      if(t===2){const m=pick([2,3]),l=pick([5,6,8]);return numTask(tx(t3(`Beim Zähneputzen läuft der Hahn: <b>${l} l</b> pro Minute. Leo putzt <b>${m} Minuten</b>, morgens und abends. Wie viele Liter fließen am Tag weg?`,`The tap runs while brushing teeth: <b>${l} l</b> per minute. Leo brushes for <b>${m} minutes</b>, morning and evening. How many litres run away each day?`,`El grifo corre mientras Leo se cepilla: <b>${l} l</b> por minuto. Se cepilla <b>${m} minutos</b>, por la mañana y por la noche. ¿Cuántos litros se van al día?`)),'',2*m*l,`2 · ${m} · ${l} = <b>${2*m*l} l</b>`,tx(t3('Zweimal am Tag!','Twice a day!','¡Dos veces al día!')),'l');}
      const f=pick([4,5,6]),d=rnd(3,8);return numTask(tx(t3(`Eine Toilettenspülung braucht <b>${f} l</b>. Jemand spült <b>${d}</b> Mal am Tag. Wie viele Liter sind das in 30 Tagen?`,`A toilet flush uses <b>${f} l</b>. Someone flushes <b>${d}</b> times a day. How many litres is that in 30 days?`,`Una cisterna gasta <b>${f} l</b>. Alguien tira de ella <b>${d}</b> veces al día. ¿Cuántos litros son en 30 días?`)),'',f*d*30,`${f} · ${d} · 30 = <b>${fmt(f*d*30)} l</b>`,tx(t3('Erst ein Tag, dann mal 30.','First one day, then times 30.','Primero un día, luego por 30.')),'l');}}
  },
  riddles:{
    sparschwein(){const z=rnd(3,9),f=rnd(1,6)*2;return {title:tx(t3('Das Sparschwein','The piggy bank','La hucha')),text:tx(t3(`Im Sparschwein sind ${z} Münzen zu 2 € und ${f} Münzen zu 50 ct. Wie viele Euro sind es zusammen?`,`The piggy bank holds ${z} coins of 2 € and ${f} coins of 50 ct. How many euros is that altogether?`,`En la hucha hay ${z} monedas de 2 € y ${f} monedas de 50 ct. ¿Cuántos euros hay en total?`)),
      f:[['€',2*z+f/2]],hint:tx(t3('Zwei 50-ct-Münzen sind 1 €.','Two 50 ct coins make 1 €.','Dos monedas de 50 ct son 1 €.')),ans:(2*z+f/2)+' €',expl:`${z} · 2 € + ${f} · 50 ct = ${2*z} € + ${f/2} € = ${2*z+f/2} €`};},

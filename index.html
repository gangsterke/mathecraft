      f:[['km',Math.floor(m/1000)],['m',m%1000]],hint:`${n} · ${r} = ${fmt(m)} m`,ans:mix(m,1000,'km','m'),expl:`${n} · ${r} m = ${fmt(m)} m = ${mix(m,1000,'km','m')}`};},
    lied(){const m=rnd(2,4),s=rnd(5,55),n=rnd(2,4),t=(m*60+s)*n;return {title:tx(t3('Das Lieblingslied','The favourite song','La canción favorita')),text:tx(t3(`Leos Lieblingslied dauert ${m} min ${s} s. Er hört es ${n} Mal hintereinander. Wie lange ist das in Sekunden?`,`Leo’s favourite song lasts ${m} min ${s} s. He plays it ${n} times in a row. How long is that in seconds?`,`La canción favorita de Leo dura ${m} min ${s} s. La escucha ${n} veces seguidas. ¿Cuánto es en segundos?`)),
      f:[['s',t]],hint:`${m} min ${s} s = ${m*60+s} s`,ans:t+' s',expl:`${n} · ${m*60+s} s = ${t} s`};}
  },
  pro:[
    ()=>({title:tx(t3('Wenige Münzen','Few coins','Pocas monedas')),text:tx(t3(`Leo will genau ${euro(388)} mit möglichst wenigen Münzen bezahlen. Es gibt 1 ct, 2 ct, 5 ct, 10 ct, 20 ct, 50 ct, 1 € und 2 €. Wie viele Münzen braucht er?`,`Leo wants to pay exactly ${euro(388)} with as few coins as possible. There are 1 ct, 2 ct, 5 ct, 10 ct, 20 ct, 50 ct, 1 € and 2 € coins. How many coins does he need?`,`Leo quiere pagar justo ${euro(388)} con las menos monedas posibles. Hay monedas de 1 ct, 2 ct, 5 ct, 10 ct, 20 ct, 50 ct, 1 € y 2 €. ¿Cuántas monedas necesita?`)),f:[[tx(t3('Münzen','Coins','Monedas')),8]],
      hint:tx(t3('Nimm immer zuerst die größte Münze, die noch passt.','Always take the biggest coin that still fits first.','Coge siempre primero la moneda más grande que aún quepa.')),ans:'8',expl:'2 € + 1 € + 50 ct + 20 ct + 10 ct + 5 ct + 2 ct + 1 ct'}),
    ()=>({title:tx(t3('Immer doppelt','Always double','Siempre el doble')),text:tx(t3('Leo schreibt vier Zahlen auf. Jede ist doppelt so groß wie die vorige. Zusammen ergeben sie 45 000. Wie heißt die kleinste Zahl?','Leo writes down four numbers. Each is twice as big as the one before. Together they make 45,000. What is the smallest number?','Leo escribe cuatro números. Cada uno es el doble del anterior. Juntos suman 45 000. ¿Cuál es el menor?')),f:[[tx(t3('Zahl','Number','Número')),3000]],
      hint:tx(t3('Die Zahlen sind 1-mal, 2-mal, 4-mal und 8-mal die kleinste. Wie oft also insgesamt?','The numbers are 1, 2, 4 and 8 times the smallest. So how many times in total?','Los números son 1, 2, 4 y 8 veces el menor. ¿Cuántas veces en total?')),ans:fmt(3000),expl:`1 + 2 + 4 + 8 = 15; ${fmt(45000)} : 15 = ${fmt(3000)}`}),
    ()=>({title:tx(t3('Steine wegnehmen','Taking counters away','Quitar fichas')),text:tx(t3('Auf einem Feld mit 5 Reihen und 5 Spalten liegt auf jedem Platz ein Stein. Leo nimmt Steine weg, bis in jeder Reihe und jeder Spalte genau 3 Steine liegen. Wie viele Steine nimmt er weg?','On a board with 5 rows and 5 columns there is a counter on every square. Leo takes counters away until every row and every column has exactly 3 counters. How many does he take away?','En un tablero de 5 filas y 5 columnas hay una ficha en cada casilla. Leo quita fichas hasta que en cada fila y cada columna haya exactamente 3. ¿Cuántas quita?')),f:[[tx(t3('Steine','Counters','Fichas')),10]],

  ]
});
function dur2(m){return `${Math.floor(m/60)} h ${m%60} min`;}

/* =========================================================
   LISTENING TASKS ("Zuhören")
   The question is read aloud and not shown, so the child has to
   listen and keep the numbers in mind. Speech uses plain digits
   (no thousands spaces) so every voice reads them correctly.
   ========================================================= */
{
const LISTEN_L=t3('Zuhören','Listen','Escuchar');
const LQ=()=>tx(t3('Hör gut zu und schreib die Antwort auf.','Listen carefully and write down the answer.','Escucha bien y escribe la respuesta.'));
/* say = spoken text, show = the same question written (shown in the solution, or when the device cannot speak) */
function listenTask(say,show,ans,unit,hint){
  const sayT=tx(say),showT=tx(show);
  return {q:LQ(),listen:sayT,listenShow:showT,
    body:`<div class="listenbox"><button type="button" class="main listenbtn">${tx(t3('Vorlesen','Read aloud','Escuchar'))}</button><p class="listenfall" hidden>${showT}</p></div>`+(unit?unitIn(unit):numIn()),
    check:v=>parseNum(v[0])===ans,
    sol:`${showT}<br><b>${fmt(ans)}${unit?' '+unit:''}</b>`,
    hint:tx(t3('Tippe auf „Nochmal hören“. ','Tap “Hear again”. ','Toca «Escuchar otra vez». '))+(tx(hint)||''),
    a:[String(ans)]};
}
function addListen(id,key,f){const d=LDEF[id];if(!d)return;d.gen[key]=f;const old=d.label;d.label=k=>k===key?tx(LISTEN_L):old(k);}
const L3=(de,en,es)=>t3(de,en,es);
const nz=n=>String(n);   /* spoken number */

addListen('million','mi_hoer',()=>{const n=pick([rnd(1,9)*100000+rnd(0,9)*1000,rnd(10,99)*10000+rnd(1,9)*100,rnd(100,999)*1000+rnd(1,99),rnd(1,9)*100000+rnd(1,9)*10+rnd(1,9)]);
  return listenTask(L3(`Schreibe die Zahl mit Ziffern: ${nz(n)}.`,`Write the number in digits: ${nz(n)}.`,`Escribe el número con cifras: ${nz(n)}.`),
    L3(`Schreibe die Zahl ${fmt(n)}.`,`Write the number ${fmt(n)}.`,`Escribe el número ${fmt(n)}.`),n,null,
    L3('Denk an die Nullen bei leeren Stellen.','Remember the zeros for empty places.','Acuérdate de los ceros en los huecos.'));});

addListen('bigcalc','bc_hoer',()=>{const plus=Math.random()<.5,a=rnd(2,9)*1000+rnd(1,9)*100,b=rnd(1,5)*1000+rnd(1,9)*100,A=plus?a:a+b;
  return plus?listenTask(L3(`Rechne im Kopf: ${nz(A)} plus ${nz(b)}.`,`Work it out in your head: ${nz(A)} plus ${nz(b)}.`,`Calcula de cabeza: ${nz(A)} más ${nz(b)}.`),`${fmt(A)} + ${fmt(b)}`,A+b,null,L3('Erst die Tausender, dann die Hunderter.','First the thousands, then the hundreds.','Primero los millares, luego las centenas.'))
    :listenTask(L3(`Rechne im Kopf: ${nz(A)} minus ${nz(b)}.`,`Work it out in your head: ${nz(A)} minus ${nz(b)}.`,`Calcula de cabeza: ${nz(A)} menos ${nz(b)}.`),`${fmt(A)} − ${fmt(b)}`,A-b,null,L3('Erst die Tausender, dann die Hunderter.','First the thousands, then the hundreds.','Primero los millares, luego las centenas.'));});

addListen('numline','nl_hoer',()=>{const st=pick([100,1000,10000]),a=rnd(1,9)*st*(st===10000?1:pick([1,10])),b=a+st*2,m=a+st;
  return listenTask(L3(`Welche Zahl liegt genau in der Mitte zwischen ${nz(a)} und ${nz(b)}?`,`Which number is exactly halfway between ${nz(a)} and ${nz(b)}?`,`¿Qué número está justo en medio entre ${nz(a)} y ${nz(b)}?`),
    L3(`Mitte zwischen ${fmt(a)} und ${fmt(b)}?`,`Halfway between ${fmt(a)} and ${fmt(b)}?`,`¿En medio entre ${fmt(a)} y ${fmt(b)}?`),m,null,L3('Wie groß ist der Abstand? Die Hälfte davon kommt dazu.','How big is the gap? Add half of it.','¿Qué distancia hay? Suma la mitad.'));});

addListen('patterns','pt_hoer',()=>{const st=pick([25,50,250,500,2500]),s0=rnd(1,8)*st,seq=[s0,s0+st,s0+2*st],nx=s0+3*st;
  return listenTask(L3(`Zähle weiter: ${seq.map(nz).join(', ')}. Welche Zahl kommt als Nächstes?`,`Keep counting: ${seq.map(nz).join(', ')}. Which number comes next?`,`Sigue contando: ${seq.map(nz).join(', ')}. ¿Qué número viene ahora?`),
    `${seq.map(fmt).join(', ')}, …`,nx,null,L3('Wie groß ist jeder Sprung?','How big is each jump?','¿De cuánto es cada salto?'));});

addListen('rounding','rd_hoer',()=>{const k=pick([10,100,1000]),n=rnd(1000,9999);const r=Math.round(n/k)*k;const kn={10:t3('Zehner','tens','decenas'),100:t3('Hunderter','hundreds','centenas'),1000:t3('Tausender','thousands','millares')}[k];
  return listenTask(L3(`Runde ${nz(n)} auf ${tx(kn)}.`,`Round ${nz(n)} to the nearest ${tx(kn).replace(/s$/,'')}.`,`Redondea ${nz(n)} a las ${tx(kn)}.`),
    L3(`Runde ${fmt(n)} auf ${tx(kn)}.`,`Round ${fmt(n)} to the nearest ${tx(kn).replace(/s$/,'')}.`,`Redondea ${fmt(n)} a las ${tx(kn)}.`),r,null,L3('Schau auf die Ziffer rechts daneben: ab 5 aufrunden.','Look at the digit to the right: 5 or more rounds up.','Mira la cifra de la derecha: desde 5 se redondea hacia arriba.'));});

addListen('mult','mu_hoer',()=>{const v=rnd(0,2);let a,b;if(v===0){a=rnd(3,9);b=rnd(2,9)*10;}else if(v===1){a=rnd(11,19);b=rnd(2,5);}else{a=rnd(2,9);b=rnd(2,9)*100;}
  return listenTask(L3(`Wie viel ist ${nz(a)} mal ${nz(b)}?`,`What is ${nz(a)} times ${nz(b)}?`,`¿Cuánto es ${nz(a)} por ${nz(b)}?`),`${fmt(a)} · ${fmt(b)}`,a*b,null,L3('Rechne erst ohne die Nullen und häng sie dann an.','Work it out without the zeros first, then add them back.','Calcula primero sin los ceros y luego añádelos.'));});

addListen('div','dv_hoer',()=>{const d=rnd(2,9),q=rnd(2,9)*pick([1,10,100]),n=d*q;
  return listenTask(L3(`Wie viel ist ${nz(n)} geteilt durch ${nz(d)}?`,`What is ${nz(n)} divided by ${nz(d)}?`,`¿Cuánto es ${nz(n)} entre ${nz(d)}?`),`${fmt(n)} : ${d}`,q,null,L3('Denk an das Einmaleins und an die Nullen.','Think of your times tables and the zeros.','Piensa en las tablas y en los ceros.'));});

addListen('area','ar_hoer',()=>{const w=rnd(2,8),l=w+rnd(1,6),um=Math.random()<.5;
  return um?listenTask(L3(`Ein Rechteck ist ${nz(l)} Zentimeter lang und ${nz(w)} Zentimeter breit. Wie lang ist der Umfang?`,`A rectangle is ${nz(l)} centimetres long and ${nz(w)} centimetres wide. How long is the perimeter?`,`Un rectángulo mide ${nz(l)} centímetros de largo y ${nz(w)} de ancho. ¿Cuánto mide el perímetro?`),
      L3(`Rechteck ${l} cm × ${w} cm: Umfang?`,`Rectangle ${l} cm × ${w} cm: perimeter?`,`Rectángulo ${l} cm × ${w} cm: ¿perímetro?`),2*(l+w),'cm',L3('Einmal ganz außen herum: zwei Längen und zwei Breiten.','All the way round: two lengths and two widths.','Toda la vuelta: dos largos y dos anchos.'))
    :listenTask(L3(`Ein Rechteck ist ${nz(l)} Zentimeter lang und ${nz(w)} Zentimeter breit. Wie viele Quadratzentimeter ist es groß?`,`A rectangle is ${nz(l)} centimetres long and ${nz(w)} centimetres wide. How many square centimetres is it?`,`Un rectángulo mide ${nz(l)} centímetros de largo y ${nz(w)} de ancho. ¿Cuántos centímetros cuadrados mide?`),
      L3(`Rechteck ${l} cm × ${w} cm: Fläche?`,`Rectangle ${l} cm × ${w} cm: area?`,`Rectángulo ${l} cm × ${w} cm: ¿área?`),l*w,'cm²',L3('Fläche: Länge mal Breite.','Area: length times width.','Área: largo por ancho.'));});

addListen('cubes','wf_hoer',()=>{const a=rnd(2,6),b=rnd(2,5),c=rnd(2,4);
  return listenTask(L3(`Ein Quader ist ${nz(a)} Würfel lang, ${nz(b)} Würfel breit und ${nz(c)} Würfel hoch. Aus wie vielen Würfeln besteht er?`,`A cuboid is ${nz(a)} cubes long, ${nz(b)} cubes wide and ${nz(c)} cubes high. How many cubes is it made of?`,`Un prisma mide ${nz(a)} cubitos de largo, ${nz(b)} de ancho y ${nz(c)} de alto. ¿Cuántos cubitos tiene?`),
    `${a} · ${b} · ${c}`,a*b*c,null,L3('Erst eine Schicht, dann mal die Höhe.','First one layer, then times the height.','Primero una capa, luego por la altura.'));});

addListen('lengths','lg_hoer',()=>{const v=rnd(0,1);
  if(v===0){const k=rnd(1,9),m=rnd(1,9)*50;return listenTask(L3(`Wie viele Meter sind ${nz(k)} Kilometer und ${nz(m)} Meter?`,`How many metres are ${nz(k)} kilometres and ${nz(m)} metres?`,`¿Cuántos metros son ${nz(k)} kilómetros y ${nz(m)} metros?`),`${k} km ${m} m = ? m`,k*1000+m,'m',L3('1 Kilometer sind 1000 Meter.','1 kilometre is 1000 metres.','1 kilómetro son 1000 metros.'));}
  const m=rnd(1,9),c=rnd(1,99);return listenTask(L3(`Wie viele Zentimeter sind ${nz(m)} Meter und ${nz(c)} Zentimeter?`,`How many centimetres are ${nz(m)} metres and ${nz(c)} centimetres?`,`¿Cuántos centímetros son ${nz(m)} metros y ${nz(c)} centímetros?`),`${m} m ${c} cm = ? cm`,m*100+c,'cm',L3('1 Meter sind 100 Zentimeter.','1 metre is 100 centimetres.','1 metro son 100 centímetros.'));});

addListen('weights','gw_hoer',()=>{const k=rnd(1,9),g=rnd(1,19)*50;
  return listenTask(L3(`Wie viele Gramm sind ${nz(k)} Kilogramm und ${nz(g)} Gramm?`,`How many grams are ${nz(k)} kilograms and ${nz(g)} grams?`,`¿Cuántos gramos son ${nz(k)} kilos y ${nz(g)} gramos?`),`${k} kg ${g} g = ? g`,k*1000+g,'g',L3('1 Kilogramm sind 1000 Gramm.','1 kilogram is 1000 grams.','1 kilo son 1000 gramos.'));});

addListen('volume','lt_hoer',()=>{const fr=pick([[t3('ein halber Liter','half a litre','medio litro'),'½ l',500],[t3('ein Viertelliter','a quarter of a litre','un cuarto de litro'),'¼ l',250],[t3('ein Dreiviertelliter','three quarters of a litre','tres cuartos de litro'),'¾ l',750],[t3('ein Achtelliter','an eighth of a litre','un octavo de litro'),'⅛ l',125]]),w=rnd(0,3);
  const sayW=w?L3(`${nz(w)} Liter und `,`${nz(w)} ${w>1?'litres':'litre'} and `,`${nz(w)} ${w>1?'litros':'litro'} y `):L3('','','');
  return listenTask(L3(`Wie viele Milliliter sind ${tx(sayW)}${tx(fr[0])}?`,`How many millilitres are ${tx(sayW)}${tx(fr[0])}?`,`¿Cuántos mililitros son ${tx(sayW)}${tx(fr[0])}?`),`${w?w+' l + ':''}${fr[1]} = ? ml`,w*1000+fr[2],'ml',L3('1 Liter sind 1000 Milliliter.','1 litre is 1000 millilitres.','1 litro son 1000 mililitros.'));});

addListen('time','zt_hoer',()=>{const v=rnd(0,1);
  if(v===0){const h=rnd(1,4),m=pick([10,15,20,30,45]);return listenTask(L3(`Wie viele Minuten sind ${nz(h)} Stunden und ${nz(m)} Minuten?`,`How many minutes are ${nz(h)} hours and ${nz(m)} minutes?`,`¿Cuántos minutos son ${nz(h)} horas y ${nz(m)} minutos?`),`${h} h ${m} min = ? min`,h*60+m,'min',L3('1 Stunde hat 60 Minuten.','1 hour has 60 minutes.','1 hora tiene 60 minutos.'));}
  const sh=rnd(8,17),d=pick([20,25,35,40,45,50,70,90]),e=sh*60+d;
  return listenTask(L3(`Ein Film beginnt um ${nz(sh)} Uhr und endet um ${nz(Math.floor(e/60))} Uhr ${nz(e%60)}. Wie viele Minuten dauert er?`,`A film starts at ${(sh%12)||12}:00 and ends at ${(Math.floor(e/60)%12)||12}:${String(e%60).padStart(2,'0')}. How many minutes does it last?`,`Una película empieza a las ${nz(sh)} y termina a las ${nz(Math.floor(e/60))} y ${nz(e%60)}. ¿Cuántos minutos dura?`),
    `${sh}:00 → ${Math.floor(e/60)}:${String(e%60).padStart(2,'0')}`,d,'min',L3('Spring erst bis zur vollen Stunde.','Jump to the full hour first.','Salta primero a la hora en punto.'));});

addListen('convert','gu_hoer',()=>{const e=rnd(1,9),c=pick([rnd(1,9),rnd(10,95)]);
  return listenTask(L3(`Wie viele Cent sind ${nz(e)} Euro und ${nz(c)} Cent?`,`How many cents are ${nz(e)} euros and ${nz(c)} cents?`,`¿Cuántos céntimos son ${nz(e)} euros y ${nz(c)} céntimos?`),`${e} € ${c} ct = ? ct`,e*100+c,'ct',L3('1 Euro sind 100 Cent. Achte auf die Stellen!','1 euro is 100 cents. Mind the places!','1 euro son 100 céntimos. ¡Cuidado con las cifras!'));});
}

/* =========================================================
   NUMBER WORD TRAINER
   ========================================================= */
const TR_LEVELS=[100,1000,100000,1000000];
const TRICKY={de:[11,12,13,16,17,20,21,30,31,60,61,66,70,71,76,77,97,99],en:[11,12,13,14,15,18,20,21,30,40,44,50,55,80,88,90,99],es:[15,16,17,18,19,21,22,23,26,30,31,41,66,77,99]};
const CHEAT={
  de:['13 dreizehn','16 sechzehn','17 siebzehn','20 zwanzig','21 einundzwanzig','30 dreißig','34 vierunddreißig','60 sechzig','70 siebzig','101 hunderteins','1000 (ein)tausend'],
  en:['12 twelve','13 thirteen','15 fifteen','18 eighteen','20 twenty','34 thirty-four','40 forty','50 fifty','90 ninety','100 one hundred','1000 one thousand'],
  es:['15 quince','16 dieciséis','21 veintiuno','22 veintidós','26 veintiséis','31 treinta y uno','100 cien','101 ciento uno','500 quinientos','700 setecientos','900 novecientos','1000 mil','21 000 veintiún mil']
};
let TRS={lang:null,lvl:0,streak:0,list:[],i:0,res:[],tries:0,n:0,state:'ask',err:{}};
try{const s=JSON.parse(localStorage.getItem('ziffi.trainer')||'{}');if(s.lvl>=0&&s.lvl<4)TRS.lvl=s.lvl;}catch(e){}
function saveTrainerPrefs(){try{localStorage.setItem('ziffi.trainer',JSON.stringify({lvl:TRS.lvl}));}catch(e){}}
function trNumber(){
  const lv=TR_LEVELS[TRS.lvl],lang=TRS.lang;
  if(TRS.lvl===0)return Math.random()<.55?pick(TRICKY[lang]):rnd(11,99);
  if(TRS.lvl===1)return Math.random()<.3?pick([101,111,116,170,199,201,315,560,777,999]):rnd(100,999);
  if(TRS.lvl===2)return makeNum(rnd(4,5),.25);
  return Math.random()<.08?1e6:makeNum(6,.25);
}
function renderTrainer(){
  if(!TRS.lang)TRS.lang=LANG;
  $('#trLangs').innerHTML=LANGS.map(l=>`<button data-l="${l}" lang="${l}" aria-pressed="${TRS.lang===l}">${NATIVE[l]}</button>`).join('');
  $('#trLevels').innerHTML=TR_LEVELS.map((v,i)=>`<button data-v="${i}" aria-pressed="${TRS.lvl===i}">${T('tr_lv',fmt(v))}</button>`).join('');
  $('#trLangs').querySelectorAll('button').forEach(b=>b.onclick=()=>{TRS.lang=b.dataset.l;saveTrainerPrefs();renderTrainer();});
  $('#trLevels').querySelectorAll('button').forEach(b=>b.onclick=()=>{TRS.lvl=+b.dataset.v;TRS.streak=0;saveTrainerPrefs();renderTrainer();});
  $('#trGeneral').textContent=T('tr_general')[TRS.lang];
  $('#trCheat').innerHTML=CHEAT[TRS.lang].map(c=>{const m=c.match(/^([\d ()a-z]+?) (.+)$/i);return `<li><b>${m?m[1]:''}</b> <span lang="${TRS.lang}">${m?m[2]:c}</span></li>`;}).join('');
  trNewRound();
}
function trNewRound(){TRS.list=Array.from({length:8},()=>0);TRS.i=0;TRS.res=[];TRS.err={};trTask();}
function trProg(){return `<div class="prog">`+TRS.list.map((_,j)=>`<i class="${j<TRS.res.length?resCls(TRS.res[j]):(j===TRS.i?'now':'')}"></i>`).join('')+`</div>`;}
function trTask(){
  TRS.tries=0;TRS.state='ask';TRS.n=trNumber();
  $('#trTask').innerHTML=`<div class="taskhead"><span class="kind">${T('task_of',TRS.i+1,8)} · ${T('tr_lv',fmt(TR_LEVELS[TRS.lvl]))}</span>${trProg()}</div>
    <p class="qtext">${T('tr_prompt',`<span class="trtarget">${FLAG[TRS.lang]} ${T('langname')[TRS.lang]}</span>`)}</p>
    <p class="bignum">${fmt(TRS.n)}</p>
    <input class="wordin" id="trIn" type="text" enterkeyhint="go" lang="${TRS.lang}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${T('tr_ph')}" aria-label="${T('answer_aria')}">
    <div class="btns"><button class="main" id="trCheck">${T('check')}</button><button id="trHint">${T('hint')}</button>${canSpeak?`<button id="trListen" hidden>${T('tr_listen')}</button>`:''}</div>
    <div id="trFb" aria-live="polite"></div>`;
  $('#trIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#trCheck').click();}});
  $('#trHint').onclick=()=>say('bad',trHintFor(TRS.lang,TRS.n),$('#trFb'));
  $('#trCheck').onclick=trCheck;
  if(canSpeak)$('#trListen').onclick=e=>speak(WORDS[TRS.lang](TRS.n),TRS.lang,e.currentTarget,.87);
}
function trHintFor(lang,n){
  const w=WORDS[lang](n),tips=T('tips'),keys=[];
  if(lang==='de'){if(/ßig/.test(w))keys.push('eszett');if(/sech(zehn|zig)/.test(w))keys.push('sech');if(/sieb(zehn|zig)/.test(w))keys.push('sieb');if(/einund/.test(w))keys.push('einsund');if(/eins$/.test(w)&&n>100)keys.push('einsend');}
  if(lang==='en'){if(/forty/.test(w))keys.push('forty');if(/eighteen/.test(w))keys.push('eighteen');if(/ninety/.test(w))keys.push('ninety');if(/fif/.test(w))keys.push('fif');if(/twelve/.test(w))keys.push('twelve');if(/thir/.test(w))keys.push('thir');}
  if(lang==='es'){if(/dieci/.test(w))keys.push('dieci');if(/veinti/.test(w))keys.push('veinti');if(/quinientos/.test(w))keys.push('quinientos');if(/setecientos/.test(w))keys.push('setecientos');if(/novecientos/.test(w))keys.push('novecientos');if(/cien(?!to)/.test(w)||/ciento/.test(w))keys.push('cien');if(/(un|ún) mil/.test(w))keys.push('un_mil');if(/ y /.test(w))keys.push('y');}
  return keys.length?keys.slice(0,2).map(k=>tips[k]).join(' '):T('tr_general')[lang];
}
const FLAG={de:'🇩🇪',en:'🇬🇧',es:'🇪🇸'};
function wrongLang(n,raw){return LANGS.find(l=>l!==TRS.lang&&checkWord(l,n,raw).ok)||null;}
function chunksHTML(lang,n){return `<span class="chunks" lang="${lang}">`+wordChunks(lang,n).map((c,i)=>`<span class="ck ck${i%3}">${escapeHTML(c)}</span>`).join('')+`</span>`;}
function trCheck(){
  const fbEl=$('#trFb'),inp=$('#trIn');
  if(TRS.state==='next'){if(Date.now()<nextLock)return;TRS.i++;if(TRS.i<8)trTask();else trFinish();return;}
  if(!inp.value.trim()){say('bad',T('enter_first'),fbEl);return;}
  const wl=wrongLang(TRS.n,inp.value);
  if(wl){inp.classList.remove('good');inp.classList.add('bad');say('bad',`<b>${T('tr_wronglang',T('langname')[wl],`${FLAG[TRS.lang]} ${T('langname')[TRS.lang]}`)}</b>`,fbEl);inp.select();return;}
  const r=checkWord(TRS.lang,TRS.n,inp.value);
  inp.classList.remove('good','bad');inp.classList.add(r.ok?'good':'bad');
  if(r.ok){
    const star=TRS.tries===0;TRS.res.push(star?true:'late');if(star)earnStar();
    TRS.streak=star?TRS.streak+1:0;
    let html=`${pick(T('praise'))} ${star?T('star1'):''}<div class="sol">${chunksHTML(TRS.lang,TRS.n)}</div>`;
    if(r.accentOnly){html=`${T('tr_accent')}<div class="sol">${chunksHTML(TRS.lang,TRS.n)}</div>`;TRS.err.accent=(TRS.err.accent||0)+1;}
    say('good',html,fbEl);FX.ok();FX.praise(TRS.streak);trToNext();return;
  }
  TRS.tries++;TRS.streak=0;if(TRS.tries===1)FX.oops();
  r.tips.forEach(k=>{TRS.err[k]=(TRS.err[k]||0)+1;});
  const tipList=r.tips.length?`<ul class="tiplist">${r.tips.map(k=>`<li>${T('tips')[k]}</li>`).join('')}</ul>`:'';
  if(TRS.tries===1){
    if(r.almost)say('bad',`<b>${T('tr_almost')}</b>${tipList}`,fbEl);
    else{const g=escapeHTML(r.got||'');const marked=r.firstDiff!==undefined?`<div class="sol"><span lang="${TRS.lang}">${g.slice(0,r.firstDiff)}<mark>${g.slice(r.firstDiff)||'…'}</mark></span></div>`:'';
      say('bad',`<b>${T('tr_not')}</b> ${T('tr_mark')}${marked}${tipList}`,fbEl);}
  }else{TRS.res.push(false);say('bad',`${T('here_right')}<div class="sol">${chunksHTML(TRS.lang,TRS.n)}</div>${tipList}`,fbEl);trToNext();}
}
function trToNext(){
  taskDone();nextLock=Date.now()+700;
  TRS.state='next';$('#trIn').disabled=true;$('#trHint').hidden=true;if(canSpeak)$('#trListen').hidden=false;
  $('#trCheck').textContent=TRS.i<7?T('next_task'):T('see_result');$('#trCheck').focus();
}
function trFinish(){
  const s=TRS.res.filter(x=>x===true).length,lang=TRS.lang,lvl=TRS.lvl,err={...TRS.err};
  record(d=>{d.rounds.push({t:Date.now(),l:'zahlwort',f:'zw',s,m:8,lang,lvl,err});});
  let up='';
  if(s>=7&&TRS.lvl<3){TRS.lvl++;saveTrainerPrefs();up=`<p class="qtext">${T('tr_up',T('tr_lv',fmt(TR_LEVELS[TRS.lvl])))}</p>`;}
  const msg=s<4?(roundEnd(s),T('tr_low')):roundEnd(s);
  $('#trTask').innerHTML=`<div class="done"><span class="kind">${T('round_done')}</span>${trProg()}<p class="stars" aria-label="${s} ★">${'★'.repeat(s)||'☆'}</p><div class="fb good" style="width:100%"><svg class="owl sm" aria-hidden="true"><use href="#owl"/></svg><div class="bubble"><b>${T('round_res',s)}</b> ${msg}</div></div>${up}<button class="main" id="trAgain">${T('new_round')}</button></div>`;
  $('#trAgain').onclick=()=>renderTrainer();
}

async function initStore(){

        q.docs.forEach(doc=>{Store.days[doc.id]=JSON.parse(JSON.stringify(doc.data()));});
      }

async function reload(){

  const m=minTasks();
  document.querySelectorAll('.gatebar').forEach(el=>{

    el.hidden=false;
    if(!GATE.active){el.className='gatebar done';el.innerHTML=`<b>${T('gate_done')}</b>`;return;}
    el.className='gatebar'+(state==='blocked'?' blocked':'');

    if(GATE.from)v=GATE.from;

  flushTime();view=v;
  if((v==='lesson'||v==='trainer')&&prev==='home')startGate(v);

}

/* ---------- games ---------- */
const GAMES={jump:{h:260},fly:{h:380},space:{h:420},maze:{h:400}};
const G={mode:'jump',active:false,started:false,dead:false,raf:0,left:0,last:0,t:0,score:0,sessionBest:0,cost:0,
  obs:[],oy:0,vy:0,speed:.38,since:0,gap:400,
  px:0,target:null,keys:{},lives:3,bombs:[],shots:[],booms:[],fireCD:0,spawnCD:0,
  W:600,H:260,col:{}};
const cv=$('#cv'),ctx=cv.getContext('2d');
function bestEver(mode){return allDays().reduce((m,d)=>Math.max(m,...(d.games||[]).filter(g=>(g.g||'jump')===mode).map(g=>g.score||0)),0);}
function startSession(mode,test){

  Object.assign(G,{mode,test:!!test,active:true,started:false,dead:false,left:s.playMin*60000,cost:test?0:s.cost,sessionBest:0,min:s.playMin});

function setupCanvas(){

  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
  G.col={ink:v('--ink'),soft:v('--soft'),muted:v('--muted'),g:v('--pv-g'),b:v('--pv-b'),r:v('--pv-r'),owl:v('--owl'),belly:v('--owl-belly'),pen:v('--pen'),card:v('--card'),game:v('--game')};

addEventListener('resize',()=>{if(view==='game')setupCanvas();});
function resetRun(){
  Object.assign(G,{t:0,score:0,dead:false,obs:[],oy:0,vy:0,speed:.38,since:0,gap:420,
    px:G.W/2,target:null,lives:3,bombs:[],shots:[],booms:[],fireCD:0,spawnCD:600});
  G.sf=null;G.starCD=2500;G.inv=0;if(G.mode==='maze')mazeInit(1);
}
function tap(){
  if(!G.active)return;
  if(!G.started){G.started=true;return;}
  if(G.dead){resetRun();return;}
  if(G.mode==='jump'&&G.oy===0)G.vy=-.95;
}
function pointerX(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)*(G.W/r.width);}
let pDown=false;
/* touch steers relative to where the finger lands, so the ship stays visible above the finger */
let drag=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();pDown=true;
  if(G.mode!=='jump'){if(e.pointerType==='mouse')G.target=pointerX(e);else{drag={x:pointerX(e),px:G.px};G.target=null;}}
  tap();});
cv.addEventListener('pointermove',e=>{
  if(G.mode==='jump')return;
  if(e.pointerType==='mouse'){G.target=pointerX(e);return;}
  if(pDown&&drag)G.target=Math.min(G.W-22,Math.max(22,drag.px+(pointerX(e)-drag.x)));});
addEventListener('pointerup',()=>{pDown=false;drag=null;});
addEventListener('pointercancel',()=>{pDown=false;drag=null;});
/* iPhone/iPad: stop the long-press selection menu and magnifier while a game is open */
['touchstart','touchmove'].forEach(t=>cv.addEventListener(t,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
['contextmenu','selectstart','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(view==='game')e.preventDefault();}));
cv.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(view!=='game')return;
  if(G.mode==='maze'){const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.code];if(d){e.preventDefault();mazeDir(d);}else if(e.code==='Space'){e.preventDefault();tap();}return;}
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();tap();}
  if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();G.keys[e.code]=true;G.target=null;if(!G.started)tap();}
});
addEventListener('keyup',e=>{delete G.keys[e.code];});
$('#gQuit').onclick=()=>endSession(false);

function loop(now){
  const dt=Math.min(50,now-G.last);G.last=now;
  if(G.active&&G.started&&!document.hidden){
    G.left-=dt;
    if(!G.dead)({fly:updateFly,space:updateSpace,jump:updateJump,maze:updateMaze}[G.mode])(dt);
    if(G.left<=0){G.left=0;draw();endSession(false);return;}
  }
  if(G.mode!=='jump')G.booms.forEach(b=>b.t+=dt),G.booms=G.booms.filter(b=>b.t<450);
  draw();
  const s=Math.ceil(G.left/1000);$('#gClock').textContent=Math.floor(s/60)+':'+pad2(s%60);
  $('#gScore').textContent=Math.floor(G.score);
  if(G.active)G.raf=requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,G.W,G.H);ctx.fillStyle=G.col.soft;ctx.fillRect(0,0,G.W,G.H);
  if(G.mode==='space')drawSpace();else if(G.mode==='maze')drawMaze();else{clouds();(G.mode==='fly'?drawFly:drawJump)();}
  const c=G.col,W=G.W,H=G.H;
  ctx.textAlign='center';ctx.fillStyle=G.mode==='space'?'#ffffff':G.mode==='maze'?'#1d2a44':c.ink;ctx.font='28px "Patrick Hand", cursive';
  if(!G.started)ctx.fillText(T('tap_start'),W/2,H/2-20);
  else if(G.dead){ctx.fillText(T('ouch',Math.floor(G.score)),W/2,H/2-30);ctx.font='20px "Patrick Hand", cursive';ctx.fillText(T('tap_again'),W/2,H/2-4);}
}
function clouds(){
  const c=G.col,W=G.W;ctx.fillStyle=c.card;
  const drift=G.mode==='fly'?0:G.t*.03;
  for(let i=0;i<4;i++){
    let x,yy;
    if(G.mode==='fly'){x=(i*W/3.3+30)%W;yy=((i*120+G.t*.02)%(G.H+60))-30;}
    else{x=((i*230-drift)%(W+160)+W+160)%(W+160)-80;yy=34+(i%2)*28;}
    ctx.beginPath();ctx.ellipse(x,yy,34,12,0,0,7);ctx.ellipse(x+22,yy-8,22,12,0,0,7);ctx.fill();
  }
}
/* Leo's picture, taken from the shared symbol so it is embedded only once */
const LEO_IMG=new Image();try{LEO_IMG.src=document.querySelector('#owl image').getAttribute('href');}catch(e){}
function drawOwlHead(x,y,r,dead){
  if(LEO_IMG.complete&&LEO_IMG.naturalWidth){
    const R=r*1.3;ctx.save();ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.clip();ctx.drawImage(LEO_IMG,x-R,y-R,R*2,R*2);
    if(dead){ctx.fillStyle='rgba(29,42,68,.45)';ctx.fillRect(x-R,y-R,R*2,R*2);}
    ctx.restore();ctx.strokeStyle='#e8862a';ctx.lineWidth=Math.max(1.5,R*.1);ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.stroke();return;
  }
  return drawLionVector(x,y,r,dead);
}
function drawLionVector(x,y,r,dead){
  /* Leo the lion: mane, ears, face, muzzle */
  ctx.fillStyle='#e8862a';ctx.beginPath();
  for(let i=0;i<12;i++){const a=i*Math.PI/6;ctx.moveTo(x+Math.cos(a)*r*1.25+r*.38,y+Math.sin(a)*r*1.25);ctx.arc(x+Math.cos(a)*r*1.25,y+Math.sin(a)*r*1.25,r*.38,0,7);}
  ctx.fill();ctx.beginPath();ctx.arc(x,y,r*1.3,0,7);ctx.fill();
  ctx.fillStyle='#f7b844';ctx.beginPath();ctx.arc(x-r*.78,y-r*.78,r*.32,0,7);ctx.arc(x+r*.78,y-r*.78,r*.32,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle='#fff0d2';ctx.beginPath();ctx.ellipse(x,y+r*.45,r*.55,r*.4,0,0,7);ctx.fill();
  ctx.fillStyle='#1d2a44';
  if(dead){ctx.fillRect(x-r*.6,y-r*.22,r*.4,Math.max(1.5,r*.12));ctx.fillRect(x+r*.2,y-r*.22,r*.4,Math.max(1.5,r*.12));}
  else{ctx.beginPath();ctx.arc(x-r*.38,y-r*.15,r*.17,0,7);ctx.arc(x+r*.38,y-r*.15,r*.17,0,7);ctx.fill();}
  ctx.fillStyle='#6b3b1f';ctx.beginPath();ctx.moveTo(x-r*.2,y+r*.22);ctx.lineTo(x+r*.2,y+r*.22);ctx.lineTo(x,y+r*.42);ctx.fill();
}

/* ---- jump ---- */
const KINDS=[{w:22,h:22,c:'g',d:[1,1]},{w:14,h:42,c:'b',d:[1,3]},{w:46,h:16,c:'r',d:[3,1]},{w:44,h:22,c:'g',d:[2,1]}];
function updateJump(dt){
  G.t+=dt;G.speed=Math.min(.85,.38+G.t*.000011);G.score+=dt*G.speed/12;
  if(G.oy<0||G.vy!==0){G.vy+=.0032*dt;G.oy+=G.vy*dt;if(G.oy>=0){G.oy=0;G.vy=0;}}
  G.obs.forEach(o=>o.x-=G.speed*dt);G.obs=G.obs.filter(o=>o.x+o.w>-10);
  G.since+=G.speed*dt;
  if(G.since>=G.gap){G.since=0;const k=pick(G.t<8000?KINDS.slice(0,3):KINDS);G.obs.push({...k,x:G.W+10});G.gap=G.speed*rnd(650,1250)+170;}
  const gy=G.H-40,ox=60,oyTop=gy-38+G.oy;
  for(const o of G.obs){if(ox+25>o.x+3&&ox+5<o.x+o.w-3&&oyTop+34>gy-o.h+3){G.dead=true;break;}}
  G.sessionBest=Math.max(G.sessionBest,Math.floor(G.score));
}
function drawJump(){
  const c=G.col,W=G.W,H=G.H,gy=H-40;
  ctx.strokeStyle=c.ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
  ctx.fillStyle=c.muted;const off=(G.t*G.speed)%40;
  for(let x=-off;x<W;x+=40){ctx.fillRect(x,gy+10,10,2);ctx.fillRect(x+22,gy+20,6,2);}
  for(const o of G.obs){
    ctx.fillStyle=c[o.c];ctx.strokeStyle=c.ink;ctx.lineWidth=2;ctx.fillRect(o.x,gy-o.h,o.w,o.h);ctx.strokeRect(o.x,gy-o.h,o.w,o.h);
    ctx.lineWidth=1;ctx.beginPath();
    for(let i=1;i<o.d[0];i++){const xx=o.x+o.w*i/o.d[0];ctx.moveTo(xx,gy-o.h);ctx.lineTo(xx,gy);}
    for(let j=1;j<o.d[1];j++){const yy=gy-o.h*j/o.d[1];ctx.moveTo(o.x,yy);ctx.lineTo(o.x+o.w,yy);}
    ctx.stroke();
  }
  const ox=60,top=gy-38+G.oy,step=G.oy===0&&G.started&&!G.dead?Math.floor(G.t/110)%2:0;
  /* Leo the lion: tail, legs, body, head */
  ctx.strokeStyle='#c9964f';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ox+4,top+26);ctx.quadraticCurveTo(ox-6,top+24,ox-4,top+14);ctx.stroke();
  ctx.fillStyle='#b07a3a';ctx.beginPath();ctx.arc(ox-4,top+13,3.5,0,7);ctx.fill();
  ctx.fillStyle='#c9964f';
  ctx.fillRect(ox+6-(step?2:0),top+30,4,8);ctx.fillRect(ox+12,top+30,4,8);ctx.fillRect(ox+19+(step?2:0),top+30,4,8);ctx.fillRect(ox+25,top+30,4,8);
  ctx.fillStyle='#ddb06a';ctx.beginPath();ctx.ellipse(ox+17,top+26,13,8,0,0,7);ctx.fill();
  drawOwlHead(ox+24,top+10,10,G.dead);
}

/* ---- fly ---- */
function updateFly(dt){
  G.t+=dt;const f=Math.min(2.6,1+G.t/50000),W=G.W,H=G.H,py=H-58;
  if(G.keys.ArrowLeft)G.px-=.42*dt;
  if(G.keys.ArrowRight)G.px+=.42*dt;
  if(G.target!==null){const d=G.target-G.px,st=.7*dt;G.px+=Math.abs(d)<st?d:Math.sign(d)*st;}
  G.px=Math.min(W-24,Math.max(24,G.px));
  G.fireCD-=dt;if(G.fireCD<=0){G.shots.push({x:G.px,y:py-22});G.fireCD=260;}
  G.shots.forEach(s=>s.y-=.75*dt);G.shots=G.shots.filter(s=>s.y>-10);
  G.spawnCD-=dt;
  if(G.spawnCD<=0){G.bombs.push({x:rnd(20,W-20),y:-16,v:(.045+Math.random()*.035)*f,w:Math.random()*6});G.spawnCD=rnd(650,1250)/f;}
  G.bombs.forEach(b=>{b.y+=b.v*dt;b.w+=dt*.004;});
  for(const b of G.bombs){
    for(const s of G.shots){if(!s.hit&&Math.abs(s.x-b.x)<15&&Math.abs(s.y-b.y)<16){s.hit=b.hit=true;G.score+=10;G.booms.push({x:b.x,y:b.y,t:0,good:true});break;}}
    if(!b.hit&&Math.abs(b.x-G.px)<24&&Math.abs(b.y-py)<20){b.hit=true;G.lives--;G.booms.push({x:b.x,y:b.y,t:0});}
    if(!b.hit&&b.y>H-26){b.hit=true;G.lives--;G.booms.push({x:b.x,y:H-26,t:0});}
  }
  G.bombs=G.bombs.filter(b=>!b.hit);G.shots=G.shots.filter(s=>!s.hit);
  if(G.lives<=0){G.lives=0;G.dead=true;}
  G.sessionBest=Math.max(G.sessionBest,Math.floor(G.score));
}
function drawFly(){
  const c=G.col,W=G.W,H=G.H,py=H-58;
  /* ground */
  ctx.fillStyle=c.g;ctx.fillRect(0,H-22,W,22);ctx.strokeStyle=c.ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H-22);ctx.lineTo(W,H-22);ctx.stroke();
  /* shots */
  ctx.fillStyle=c.pen;G.shots.forEach(s=>{ctx.beginPath();ctx.ellipse(s.x,s.y,3,7,0,0,7);ctx.fill();});
  /* bombs */
  G.bombs.forEach(b=>{
    ctx.fillStyle='#2b2f3a';ctx.strokeStyle=c.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,12,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#5a6070';ctx.beginPath();ctx.arc(b.x-4,b.y-4,3,0,7);ctx.fill();
    ctx.strokeStyle='#8a6a3a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x+5,b.y-10);ctx.quadraticCurveTo(b.x+10,b.y-18,b.x+6,b.y-21);ctx.stroke();
    ctx.fillStyle=Math.floor(b.w)%2?'#f2a516':'#ffd23f';ctx.beginPath();ctx.arc(b.x+6,b.y-22,3,0,7);ctx.fill();
  });
  /* explosions */
  G.booms.forEach(b=>{const p=b.t/450;ctx.globalAlpha=1-p;ctx.fillStyle=b.good?c.game:c.pen;
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.arc(b.x+Math.cos(a)*p*26,b.y+Math.sin(a)*p*26,4*(1-p)+1,0,7);ctx.fill();}
    ctx.globalAlpha=1;
    if(b.good&&p<.8){ctx.fillStyle=c.ink;ctx.font='16px "Patrick Hand", cursive';ctx.textAlign='center';ctx.fillText('+10',b.x,b.y-14-p*20);}
  });
  /* plane with Leo */
  const x=G.px;
  ctx.fillStyle=c.b;ctx.strokeStyle=c.ink;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x-26,py+6);ctx.lineTo(x+26,py+6);ctx.lineTo(x+20,py+14);ctx.lineTo(x-20,py+14);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-11,py+26);ctx.lineTo(x+11,py+26);ctx.lineTo(x+7,py+20);ctx.lineTo(x-7,py+20);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=c.r;ctx.beginPath();ctx.ellipse(x,py+6,8,20,0,0,7);ctx.fill();ctx.stroke();
  drawOwlHead(x,py+2,7,G.dead);
  /* hearts */
  ctx.textAlign='left';ctx.font='22px sans-serif';ctx.fillStyle=c.pen;
  ctx.fillText('♥'.repeat(G.lives)+'♡'.repeat(3-G.lives),10,28);
}


/* ---- space: dodge rocks with a rocket ---- */
function initStarfield(){G.sf=Array.from({length:70},()=>({x:Math.random()*G.W,y:Math.random()*G.H,z:Math.random()}));}
function makeRock(f){
  const r=rnd(11,26),pts=Array.from({length:9},(_,i)=>({a:i*Math.PI*2/9,k:.72+Math.random()*.28}));
  return {x:rnd(r,G.W-r),y:-r-4,r,v:(.07+Math.random()*.08)*f,vx:(Math.random()-.5)*.05,a:Math.random()*6,va:(Math.random()-.5)*.003,pts,
    cr:[[Math.random()*.6-.3,Math.random()*.6-.3,.22],[Math.random()*.6-.3,Math.random()*.6-.3,.15]]};
}
function updateSpace(dt){
  G.t+=dt;const f=Math.min(2.4,1+G.t/45000),W=G.W,H=G.H,py=H-62;
  if(G.keys.ArrowLeft)G.px-=.45*dt;
  if(G.keys.ArrowRight)G.px+=.45*dt;
  if(G.target!==null){const d=G.target-G.px,st=.75*dt;G.px+=Math.abs(d)<st?d:Math.sign(d)*st;}
  G.px=Math.min(W-22,Math.max(22,G.px));
  G.score+=dt*.01*f;
  if(!G.sf)initStarfield();
  G.sf.forEach(s=>{s.y+=(.03+s.z*.14)*dt*f;if(s.y>H){s.y=-2;s.x=Math.random()*W;}});
  G.spawnCD-=dt;
  if(G.spawnCD<=0){G.bombs.push(makeRock(f));G.spawnCD=rnd(420,850)/f;}
  G.starCD=(G.starCD===undefined?2500:G.starCD)-dt;
  if(G.starCD<=0){G.shots.push({x:rnd(20,W-20),y:-12,v:.11*f});G.starCD=rnd(2500,4500);}
  G.inv=Math.max(0,(G.inv||0)-dt);
  for(const r of G.bombs){
    r.y+=r.v*dt;r.x+=r.vx*dt;r.a+=r.va*dt;
    if(r.x<r.r||r.x>W-r.r)r.vx*=-1;
    if(!G.inv&&Math.hypot(r.x-G.px,r.y-(py+4))<r.r*.82+14){G.lives--;G.inv=1300;G.booms.push({x:G.px,y:py,t:0});r.hit=true;}
  }
  for(const s of G.shots){
    s.y+=s.v*dt;
    if(Math.hypot(s.x-G.px,s.y-py)<26){s.hit=true;G.score+=25;G.booms.push({x:s.x,y:s.y,t:0,good:true,pts:25});}
  }
  G.bombs=G.bombs.filter(r=>!r.hit&&r.y<H+40);G.shots=G.shots.filter(s=>!s.hit&&s.y<H+20);
  if(G.lives<=0){G.lives=0;G.dead=true;}
  G.sessionBest=Math.max(G.sessionBest,Math.floor(G.score));
}
function starPath(x,y,R,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}
function drawSpace(){
  const W=G.W,H=G.H,py=H-62,c=G.col;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070b1f');g.addColorStop(1,'#1d1450');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!G.sf)initStarfield();
  G.sf.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${.35+s.z*.65})`;ctx.fillRect(s.x,s.y,1+s.z*1.6,1+s.z*1.6+(G.started&&!G.dead?s.z*3:0));});
  /* planet */
  ctx.fillStyle='#6b4fd8';ctx.beginPath();ctx.arc(W-46,58,26,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(W-54,50,9,0,7);ctx.fill();
  ctx.strokeStyle='#f2a516';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(W-46,58,42,9,-.35,0,7);ctx.stroke();
  /* collectible stars */
  G.shots.forEach(s=>{ctx.fillStyle='#ffd23f';ctx.strokeStyle='#f2a516';ctx.lineWidth=1.5;starPath(s.x,s.y,10,4.5);ctx.fill();ctx.stroke();});
  /* rocks */
  G.bombs.forEach(r=>{
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);
    ctx.fillStyle='#8a7f74';ctx.strokeStyle='#4e463f';ctx.lineWidth=2;ctx.beginPath();
    r.pts.forEach((p,i)=>{const x=Math.cos(p.a)*r.r*p.k,y=Math.sin(p.a)*r.r*p.k;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#6d645b';r.cr.forEach(([cx,cy,cr])=>{ctx.beginPath();ctx.arc(cx*r.r,cy*r.r,cr*r.r,0,7);ctx.fill();});
    ctx.restore();
  });
  /* bursts */
  G.booms.forEach(b=>{const p=b.t/450;ctx.globalAlpha=1-p;ctx.fillStyle=b.good?'#ffd23f':'#ff6b4a';
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.arc(b.x+Math.cos(a)*p*28,b.y+Math.sin(a)*p*28,4*(1-p)+1,0,7);ctx.fill();}
    ctx.globalAlpha=1;if(b.good&&p<.8){ctx.fillStyle='#ffffff';ctx.font='16px "Patrick Hand", cursive';ctx.textAlign='center';ctx.fillText('+'+(b.pts||10),b.x,b.y-14-p*20);}});
  /* rocket */
  const x=G.px,blink=G.inv&&Math.floor(G.inv/100)%2;
  if(!blink){
    if(G.started&&!G.dead){const fl=10+Math.random()*8;ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(x-7,py+24);ctx.lineTo(x+7,py+24);ctx.lineTo(x,py+24+fl);ctx.fill();
      ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(x-4,py+24);ctx.lineTo(x+4,py+24);ctx.lineTo(x,py+24+fl*.6);ctx.fill();}
    ctx.fillStyle='#e34a3a';ctx.strokeStyle='#1d2a44';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-12,py+10);ctx.lineTo(x-20,py+26);ctx.lineTo(x-10,py+22);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+12,py+10);ctx.lineTo(x+20,py+26);ctx.lineTo(x+10,py+22);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#f4f6fb';ctx.beginPath();ctx.moveTo(x,py-30);ctx.bezierCurveTo(x+16,py-16,x+14,py+14,x+10,py+24);ctx.lineTo(x-10,py+24);ctx.bezierCurveTo(x-14,py+14,x-16,py-16,x,py-30);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e34a3a';ctx.beginPath();ctx.moveTo(x,py-30);ctx.bezierCurveTo(x+9,py-23,x+11,py-18,x+12,py-15);ctx.lineTo(x-12,py-15);ctx.bezierCurveTo(x-11,py-18,x-9,py-23,x,py-30);ctx.fill();ctx.stroke();
    ctx.fillStyle='#9fd3ff';ctx.beginPath();ctx.arc(x,py-2,9,0,7);ctx.fill();ctx.stroke();
    drawOwlHead(x,py-1,6,G.dead);
  }
  ctx.textAlign='left';ctx.font='22px sans-serif';ctx.fillStyle='#ff5c6f';
  ctx.fillText('♥'.repeat(G.lives)+'♡'.repeat(3-G.lives),10,28);
}

/* ---- maze: collect cookies in a hedge maze, avoid rain clouds ---- */
const MAZE=[
'#############',
'#*....#....*#',
'#.##.###.##.#',
'#...........#',
'#.#.#####.#.#',
'#.#...#...#.#',
'#.###.#.###.#',
'#.....B.....#',
'###.#####.###',
'#.....B.....#',
'#.##.###.##.#',
'#*.........*#',
'#.##.#.#.##.#',
'#....#P#....#',
'#############'];
const DIRS=[[0,-1],[0,1],[-1,0],[1,0]];
function mazeInit(level){
  const grid=MAZE.map(r=>r.split(''));let start=null;const bugs=[];
  grid.forEach((row,y)=>row.forEach((ch,x)=>{if(ch==='P'){start=[x,y];row[x]=' ';}if(ch==='B'){bugs.push([x,y]);row[x]=' ';}}));
  const seeds=grid.reduce((m,r)=>m+r.filter(c=>c==='.'||c==='*').length,0);
  const n=level>=2?3:2,starts=[bugs[0],bugs[1],bugs[0]].slice(0,n);
  G.mz={grid,start,starts,seeds,level,shield:0,pause:900,
    pl:{x:start[0],y:start[1],d:[0,0],next:[0,0],p:0},
    en:starts.map((s,i)=>({x:s[0],y:s[1],d:[i%2?1:-1,0],p:0,wait:1500+i*1500}))};
}
const mOpen=(x,y)=>{const r=G.mz.grid[y];return !!r&&r[x]!==undefined&&r[x]!=='#';};
function mazeDir(d){if(!G.active)return;if(!G.started||G.dead){tap();}if(G.mz)G.mz.pl.next=d;}
function mazeResetPositions(){const m=G.mz;m.pl={x:m.start[0],y:m.start[1],d:[0,0],next:[0,0],p:0};m.en.forEach((e,i)=>{e.x=m.starts[i][0];e.y=m.starts[i][1];e.d=[i%2?1:-1,0];e.p=0;e.wait=1500+i*1200;});m.pause=900;}
function mazeArrive(e,isPlayer){
  const m=G.mz;
  if(isPlayer){
    const c=m.grid[e.y][e.x];
    if(c==='.'){m.grid[e.y][e.x]=' ';m.seeds--;G.score+=1;}
    if(c==='*'){m.grid[e.y][e.x]=' ';m.seeds--;G.score+=10;m.shield=5000;G.booms.push({x:e.x,y:e.y,t:0,good:true,pts:10,cell:true});}
    if(e.next[0]||e.next[1]){if(mOpen(e.x+e.next[0],e.y+e.next[1])){e.d=e.next;return;}}
    if(!mOpen(e.x+e.d[0],e.y+e.d[1]))e.d=[0,0];
    return;
  }
  const back=[-e.d[0],-e.d[1]];
  let opts=DIRS.filter(d=>mOpen(e.x+d[0],e.y+d[1])&&!(d[0]===back[0]&&d[1]===back[1]));
  if(!opts.length)opts=[back];
  const pl=m.pl,chase=Math.random()<(m.shield?.15:.5+.08*m.level);
  if(chase){opts.sort((a,b)=>(Math.abs(e.x+a[0]-pl.x)+Math.abs(e.y+a[1]-pl.y))-(Math.abs(e.x+b[0]-pl.x)+Math.abs(e.y+b[1]-pl.y)));e.d=opts[0];}
  else e.d=pick(opts);
}
function mazeMove(e,speed,dt,isPlayer){
  if(isPlayer){
    const n=e.next;
    if((n[0]||n[1])&&n[0]===-e.d[0]&&n[1]===-e.d[1]&&e.p>0){e.x+=e.d[0];e.y+=e.d[1];e.d=n;e.p=1-e.p;}
    if(!e.d[0]&&!e.d[1]){e.p=0;mazeArrive(e,true);if(!e.d[0]&&!e.d[1])return;}
  }
  e.p+=speed*dt;
  while(e.p>=1){e.x+=e.d[0];e.y+=e.d[1];e.p-=1;mazeArrive(e,isPlayer);if(!e.d[0]&&!e.d[1]){e.p=0;break;}}
}
function updateMaze(dt){
  const m=G.mz;if(!m)return;
  G.t+=dt;
  if(m.pause>0){m.pause-=dt;return;}
  m.shield=Math.max(0,m.shield-dt);
  mazeMove(m.pl,.0045,dt,true);
  const es=.0024*(1+.12*(m.level-1));
  m.en.forEach(e=>{if(e.wait>0){e.wait-=dt;return;}mazeMove(e,m.shield?es*.6:es,dt,false);});
  const px=m.pl.x+m.pl.d[0]*m.pl.p,py=m.pl.y+m.pl.d[1]*m.pl.p;
  if(!m.shield){
    for(const e of m.en){const ex=e.x+e.d[0]*e.p,ey=e.y+e.d[1]*e.p;
      if(Math.hypot(ex-px,ey-py)<.62){G.lives--;G.booms.push({x:px,y:py,t:0,cell:true});
        if(G.lives<=0){G.lives=0;G.dead=true;}else mazeResetPositions();break;}}
  }
  if(m.seeds<=0){G.score+=50;const lv=m.level+1;mazeInit(lv);G.booms.push({x:6,y:7,t:0,good:true,pts:50,cell:true});}
  G.sessionBest=Math.max(G.sessionBest,Math.floor(G.score));
}
function drawCloud(x,y,s,sad,t){
  ctx.fillStyle=sad?'#8d99ae':'#c9d2df';ctx.strokeStyle='#4a5568';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x-s*.32,y+s*.05,s*.3,0,7);ctx.arc(x+s*.02,y-s*.15,s*.38,0,7);ctx.arc(x+s*.36,y+s*.05,s*.28,0,7);ctx.rect(x-s*.55,y+s*.02,s*1.1,s*.3);ctx.fill();
  ctx.fillStyle='#1d2a44';ctx.beginPath();ctx.arc(x-s*.15,y,s*.06,0,7);ctx.arc(x+s*.17,y,s*.06,0,7);ctx.fill();
  ctx.strokeStyle='#1d2a44';ctx.lineWidth=1.5;ctx.beginPath();
  if(sad)ctx.arc(x+.01*s,y+s*.24,s*.12,Math.PI*1.15,Math.PI*1.85);else ctx.arc(x+.01*s,y+s*.1,s*.1,Math.PI*.15,Math.PI*.85);ctx.stroke();
  ctx.fillStyle='#4f8fe0';const k=(t/180)%1;
  [[-.25,0],[.2,.4]].forEach(([dx,o])=>{const yy=y+s*(.42+((k+o)%1)*.25);ctx.beginPath();ctx.ellipse(x+dx*s,yy,s*.05,s*.08,0,0,7);ctx.fill();});
}
function drawMaze(){
  const m=G.mz,cs=G.cell,ox=(G.W-cs*13)/2,W=G.W,H=G.H;
  ctx.fillStyle='#bfe3a5';ctx.fillRect(0,0,W,H);
  if(!m)return;
  const X=x=>ox+x*cs+cs/2,Y=y=>y*cs+cs/2;
  m.grid.forEach((row,y)=>row.forEach((c,x)=>{
    if(c==='#'){ctx.fillStyle='#3b8f3e';ctx.fillRect(ox+x*cs,y*cs,cs,cs);ctx.fillStyle='#2f7a32';
      ctx.beginPath();ctx.arc(ox+x*cs+cs*.3,y*cs+cs*.35,cs*.14,0,7);ctx.arc(ox+x*cs+cs*.7,y*cs+cs*.65,cs*.12,0,7);ctx.fill();}
    else{ctx.fillStyle='#e3f3d4';ctx.fillRect(ox+x*cs,y*cs,cs,cs);
      if(c==='.'){ctx.fillStyle='#c98a3c';ctx.beginPath();ctx.arc(X(x),Y(y),cs*.11,0,7);ctx.fill();ctx.fillStyle='#6b3b1f';ctx.beginPath();ctx.arc(X(x)-cs*.03,Y(y)-cs*.02,cs*.025,0,7);ctx.arc(X(x)+cs*.04,Y(y)+cs*.03,cs*.025,0,7);ctx.fill();}
      if(c==='*'){const pulse=1+Math.sin(G.t/200)*.1;ctx.fillStyle='#ffd23f';ctx.strokeStyle='#f2a516';ctx.lineWidth=1.5;starPath(X(x),Y(y),cs*.38*pulse,cs*.17*pulse);ctx.fill();ctx.stroke();}}
  }));
  m.en.forEach(e=>drawCloud(X(e.x+e.d[0]*e.p),Y(e.y+e.d[1]*e.p)-cs*.08,cs*.95,!m.shield,G.t));
  const pl=m.pl,px=X(pl.x+pl.d[0]*pl.p),py=Y(pl.y+pl.d[1]*pl.p),r=cs*.4;
  if(m.shield){ctx.strokeStyle=`rgba(242,165,22,${.5+.4*Math.sin(G.t/90)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,r*1.35,0,7);ctx.stroke();}
  drawOwlHead(px,py,r*.8,G.dead);
  G.booms.forEach(b=>{const p=b.t/450,bx=X(b.x),by=Y(b.y);ctx.globalAlpha=1-p;ctx.fillStyle=b.good?'#f2a516':'#d7263d';
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.arc(bx+Math.cos(a)*p*26,by+Math.sin(a)*p*26,4*(1-p)+1,0,7);ctx.fill();}
    ctx.globalAlpha=1;if(b.good&&p<.8){ctx.fillStyle='#1d2a44';ctx.font='16px "Patrick Hand", cursive';ctx.textAlign='center';ctx.fillText('+'+b.pts,bx,by-14-p*20);}});
  ctx.textAlign='left';ctx.font='18px sans-serif';ctx.fillStyle='#ff5c6f';ctx.fillText('♥'.repeat(G.lives)+'♡'.repeat(Math.max(0,3-G.lives)),ox+4,cs*.75);
  ctx.textAlign='right';ctx.font='18px "Patrick Hand", cursive';ctx.fillStyle='#ffffff';ctx.fillText('Level '+m.level,ox+cs*13-4,cs*.75);
}
let mzSwipe=null;
cv.addEventListener('pointerdown',e=>{if(G.mode==='maze')mzSwipe={x:e.clientX,y:e.clientY};});
addEventListener('pointerup',e=>{
  if(G.mode!=='maze'||!mzSwipe)return;
  const dx=e.clientX-mzSwipe.x,dy=e.clientY-mzSwipe.y;mzSwipe=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  mazeDir(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]);
});
cv.addEventListener('pointermove',e=>{
  if(G.mode!=='maze'||!mzSwipe)return;
  const dx=e.clientX-mzSwipe.x,dy=e.clientY-mzSwipe.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>=24){mazeDir(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]);mzSwipe={x:e.clientX,y:e.clientY};}
});
document.querySelectorAll('#dpad [data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();mazeDir(JSON.parse(b.dataset.d));}));

function endSession(silent){
  if(!G.active)return;
  G.active=false;cancelAnimationFrame(G.raf);
  const best=G.sessionBest,mode=G.mode;
  if(!G.test)record(d=>{d.games.push({t:Date.now(),score:best,cost:G.cost,min:G.min,g:mode});});
  $('#gQuit').hidden=true;
  $('#gEndText').innerHTML=G.left<=0?T('time_up',best):T('ended',best);
  $('#gEnd').hidden=false;
  if(!silent)$('#gBest').textContent=bestEver(mode);
}


/* ---------- start ---------- */
applyStatic();renderLesson();refreshStars();renderHome();initStore();
</script>
